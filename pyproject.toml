[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-workbench"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "biopython==1.85",
    "fastapi>=0.115,<1",
    "numpy==2.5.1",
    "pyyaml>=6,<7",
    "rfc8785==0.1.4",
    "scipy==1.18.0",
    "tmtools==0.3.0",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
protein-workbench-server = "protein_workbench_public.cli:main"

[project.optional-dependencies]
dev = [
    "build==1.5.0",
    "esm @ git+https://github.com/Biohub/esm.git@917af90b624535eed1e072d343c717e3ec11fef4",
    "httpx>=0.27,<1",
    "httpx2==2.12.0",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "setuptools==83.0.0",
    "torch>=2.2,<3",
    "transformers @ git+https://github.com/Biohub/transformers.git@ef32577f55da19a4989cd7b22e004dc43a4998cb",
]
providers = [
    "esm @ git+https://github.com/Biohub/esm.git@917af90b624535eed1e072d343c717e3ec11fef4",
    "simplefold @ git+https://github.com/apple/ml-simplefold.git@c7a5570a6be9f5c695126e27c804e77567209934",
    "torch>=2.2,<3",
    "transformers @ git+https://github.com/Biohub/transformers.git@ef32577f55da19a4989cd7b22e004dc43a4998cb",
]

[tool.setuptools.packages.find]
include = [
    "core*",
    "datatypes*",
    "examples*",
    "modules*",
    "pdbs*",
    "protein_workbench_public*",
    "verification",
    "verification.*",
]
exclude = ["verification-results", "verification-results.*"]

[tool.setuptools.package-data]
examples = ["*.json", "v2/*.json", "v2/*.md"]
modules = ["**/*.yaml"]
pdbs = ["1PGA-75-gen1_0690.pdb", "2EMO.pdb", "3GB1.pdb", "5G53.pdb"]
protein_workbench_public = ["resources/v2/*.json"]

[tool.setuptools.exclude-package-data]
modules = [
    "**/fixture/*",
    "**/fixture/**/*",
    "**/fixtures/*",
    "**/fixtures/**/*",
    "**/test/*",
    "**/test/**/*",
    "**/tests/*",
    "**/tests/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "-m",
    "not acceptance and not installed_package and not deterministic_acceptance and not live_provider and not local_provider and not slow and not scientific_repro and not repair_findings",
]
markers = [
    "acceptance: tests that exercise real providers, models, or binaries",
    "deterministic_acceptance: provider-fixture acceptance through the public backend protocol",
    "installed_package: builds and installs release artifacts in an isolated environment",
    "live_provider: tests that make remote provider calls",
    "local_provider: tests that execute installed local providers or binaries",
    "fresh_remote_real: one source-bound canonical run against all required real providers",
    "slow: tests with long or heavy model loading",
    "scientific_repro: deterministic reproductions intentionally red until their repair ticket",
    "repair_findings: deterministic post-review reproductions intentionally red until repaired",
]
