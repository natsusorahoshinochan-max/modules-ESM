[build-system]
requires = ["setuptools>=80,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-workbench"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "biopython==1.85",
    "gemmi==0.7.3",
    "fastapi>=0.115,<1",
    "numpy==2.5.1",
    "pip>=24,<27",
    "pyyaml>=6,<7",
    "rfc8785==0.1.4",
    "scipy==1.18.0",
    "tmtools==0.3.0",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
protein-workbench-server = "protein_workbench_public.cli:main"

[project.optional-dependencies]
dev = [
    "build==1.5.0",
    "esm @ git+https://github.com/Biohub/esm.git@43b4548b86762edfa747b07d5f440aad3c33acee",
    "httpx>=0.27,<1",
    "pytest>=9.1.1",
    "setuptools>=80,<82",
    "torch>=2.2,<3",
    "transformers @ git+https://github.com/Biohub/transformers.git@ef32577f55da19a4989cd7b22e004dc43a4998cb",
]
providers = [
    "esm @ git+https://github.com/Biohub/esm.git@43b4548b86762edfa747b07d5f440aad3c33acee",
    "httpx[socks]>=0.27,<1",
    "simplefold @ git+https://github.com/apple/ml-simplefold.git@c7a5570a6be9f5c695126e27c804e77567209934",
    "torch>=2.2,<3",
    "transformers @ git+https://github.com/Biohub/transformers.git@ef32577f55da19a4989cd7b22e004dc43a4998cb",
]

[tool.setuptools.packages.find]
exclude = ["examples.external_module*", "examples.independent_consumer*", "examples.typescript_module*"]
include = [
    "core*",
    "datatypes*",
    "examples*",
    "modules*",
    "protein_workbench_public*",
]

[tool.setuptools.package-data]
examples = [
    "*.json",
    "v2/*.json",
    "v2/*.zip",
    "v2/structures/*.pdb",
]
modules = ["**/*.js", "**/*.md", "**/*.json", "**/*.yaml", "**/ui/build/*.js", "**/ui/build/*.css"]
"modules.structure_comparison" = ["sample/*.pdb", "sample/*.cif"]
"modules.structure_conversion" = ["sample/*.pdb"]
protein_workbench_public = ["module_ui/package.json", "module_ui/index.d.ts", "resources/tutorial/*.json"]

[tool.setuptools.exclude-package-data]
examples = ["external_module/*", "independent_consumer/*", "typescript_module/*"]

