schema_version: "2.1.0"
node_type_id: contract_test.esm3_prompt_source
version: "3.0.0"
title: ESM-3 prompt source
summary: Emits deterministic single-chain ProteinPrompt inputs for ESM-3 conformance.
category: contract_test
inputs: []
outputs:
  - name: protein_prompt
    port_type_id: protein.prompt
    port_type_version: "3.0.0"
    required: true
    multiplicity: one
    scientific_meaning: Independent single-chain prompt with the requested conditioning mode.
parameter_groups:
  - id: fixture
    title: Fixture
    parameters: [mode]
node_parameters:
  mode:
    parameter_scope: scientific
    scientific_meaning: Exact prompt conditioning fixture.
    value_contract:
      type: string
      enum:
        - unassigned
        - assigned_sequence
        - coordinate_conditioned
        - coordinate_conditioned_291
        - rich_masked
        - rich_assigned
    default: unassigned
