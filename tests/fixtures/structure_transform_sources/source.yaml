node_type_id: contract_test.structure_transform_source
title: Structure-transform fixture source
summary: Emits one deterministic full-atom PDB structure for public contract tests.
category: contract_test
inputs: []
outputs:
  - name: structure
    port_type_id: protein.structure
    required: true
    multiplicity: one
    scientific_meaning: One deterministic full-atom protein structure fixture.
  - name: structure_candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Singleton Candidate form of the exact same structure fixture.
parameter_groups:
  - id: fixture
    title: Fixture
    parameters:
      - fixture
node_parameters:
  fixture:
    parameter_scope: scientific
    scientific_meaning: Exact deterministic structure fixture to emit.
    value_contract:
      type: string
      enum:
        - canonical
        - alternate_locations
        - missing_backbone
        - multi_model
        - residue_name_conflict
        - sequence_edge_cases
        - mse_ligand_water
        - unknown_modified_polymer
        - unknown_atom_polymer
        - csh
        - 2emo
        - 5g53
    required: true
