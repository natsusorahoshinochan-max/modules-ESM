node_type_id: contract_test.synthetic_candidate_source
title: Synthetic Candidate source
summary: Emits one deterministic Candidate for Module Package conformance.
category: contract_test
inputs: []
outputs:
  - name: text
    port_type_id: contract_test.synthetic_text
    required: true
    multiplicity: one
    scientific_meaning: Deterministically repeated contract-test text.
  - name: candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: One deterministic protein Candidate.
  - name: artifact
    port_type_id: contract_test.synthetic_artifact
    required: true
    multiplicity: one
    scientific_meaning: Standalone text artifact with the echoed bytes.
    artifact_kind: standalone
    artifact_media_type: text/plain
parameter_groups:
  - id: source
    title: Candidate source contract
    parameters:
      - message
node_parameters:
  message:
    parameter_scope: scientific
    scientific_meaning: Exact text repeated by the synthetic source.
    value_contract:
      type: string
      minLength: 1
      maxLength: 16
    required: true
