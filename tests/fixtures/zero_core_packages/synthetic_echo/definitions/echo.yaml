node_type_id: contract_test.synthetic_echo
title: Synthetic contract echo
summary: Scores and echoes admitted Candidates for Module Package conformance.
category: contract_test
inputs:
  - name: candidate_input
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Admitted Candidate collection echoed as the scored subject.
outputs:
  - name: text
    port_type_id: contract_test.synthetic_text
    required: true
    multiplicity: one
    scientific_meaning: Deterministically repeated contract-test text.
  - name: candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Input Candidate collection echoed without reassociation.
  - name: scores
    port_type_id: score.collection
    required: true
    multiplicity: one
    scientific_meaning: One typed intrinsic Observation for each input Candidate.
  - name: artifact
    port_type_id: contract_test.synthetic_artifact
    required: true
    multiplicity: one
    scientific_meaning: Standalone text artifact containing the echoed value.
    artifact_kind: standalone
    artifact_media_type: text/plain
parameter_groups:
  - id: echo
    title: Echo contract
    parameters:
      - message
node_parameters:
  message:
    parameter_scope: scientific
    scientific_meaning: Text whose exact content defines the echo result.
    value_contract:
      type: string
      minLength: 1
      maxLength: 32
    required: true
