[build-system]
requires = ["setuptools>=80,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "workbench-note-consumer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["protein-workbench"]

[project.entry-points."protein_workbench.modules"]
reader = "workbench_note_consumer:module"

[tool.setuptools.package-data]
workbench_note_consumer = ["FORMAT.md", "sample/*"]
