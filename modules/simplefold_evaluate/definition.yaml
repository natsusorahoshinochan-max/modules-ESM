module_id: simplefold.evaluate
version: 1.0.0
display_name: SimpleFold Evaluate
category: scoring
description: "Evaluates existing protein structures to produce pLDDT scores without re-folding. Uses a larger model (360M default)."
input_ports:
  - name: structure
    type_id: protein.structure
    required: false
    display_name: Structure
    description: "Single protein structure to evaluate."
  - name: candidates
    type_id: candidate.collection
    required: false
    display_name: Candidates
    description: "Collection of structure candidates to evaluate."
input_groups:
  - name: evaluation_input
    alternatives:
      - [structure]
      - [candidates]
output_ports:
  - name: scores
    type_id: score.collection
    display_name: Scores
    description: "Per-residue pLDDT scores."
parameters:
  - name: model_name
    type: enum
    default: "simplefold_360M"
    display_name: Model
    description: "SimpleFold model for evaluation pLDDT."
    options:
      - "simplefold_360M"
      - "simplefold_700M"
      - "simplefold_1.1B"
      - "simplefold_1.6B"
      - "simplefold_3B"
module_api: "1.0"
