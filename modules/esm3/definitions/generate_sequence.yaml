schema_version: "2.1.0"
node_type_id: esm3.generate_sequence
version: "7.0.0"
title: Generate sequences with remote ESM-3
summary: Samples the sequence track of one exact ProteinPrompt with at least one masked sequence residue, without changing any conditioning track.
category: generation
inputs:
  - name: protein_prompt
    port_type_id: protein.prompt
    port_type_version: "3.0.0"
    required: true
    multiplicity: one
    scientific_meaning: Complete residue-aligned conditioning Prompt with at least one masked sequence residue, translated without implicit track conversion.
outputs:
  - name: sequence_candidates
    port_type_id: candidate.collection
    port_type_version: "3.0.0"
    required: true
    multiplicity: one
    scientific_meaning: Ordered complete sequence Candidates produced by sequence-track generation.
  - name: sequence_reconstruction_candidates
    port_type_id: candidate.collection
    port_type_version: "3.0.0"
    required: false
    multiplicity: one
    scientific_meaning: Coordinate-conditioned prompt reconstructions returned by the sequence operation, never independent structure samples.
  - name: confidence_facts
    port_type_id: structure_prediction.confidence_facts
    port_type_version: "1.0.0"
    required: false
    multiplicity: one
    scientific_meaning: Subjectless provider confidence facts keyed one-to-one to sequence_reconstruction_candidates, carrying the exact prediction-input axis, pTM, per-residue pLDDT, and optional PAE for later admitted-Candidate materialization.
parameter_groups:
  - id: generation
    title: Generation controls
    parameters:
      - effective_seed
      - num_samples
      - num_steps
      - temperature
      - top_p
      - schedule
      - strategy
      - temperature_annealing
node_parameters:
  effective_seed:
    parameter_scope: scientific
    scientific_meaning: Configured base seed used by Bindings with exact seed control; a provider-uncontrolled Binding records no effective seed.
    required: true
    value_contract:
      type: integer
      minimum: 0
      maximum: 9007199254740991
  num_samples:
    parameter_scope: scientific
    scientific_meaning: Exact ordered number of provider samples.
    value_contract:
      type: integer
      minimum: 1
      maximum: 100
    default: 1
  num_steps:
    parameter_scope: scientific
    scientific_meaning: Requested upper bound on ESM-3 iterative unmasking steps; the official SDK may lower the effective count to the encoded sequence length or the number of sampled positions for the selected track.
    value_contract:
      type: integer
      minimum: 1
      maximum: 2048
    default: 20
  temperature:
    parameter_scope: scientific
    scientific_meaning: Fixed provider sampling temperature.
    value_contract:
      type: number
      minimum: 0
      maximum: 10
    default: 1
  top_p:
    parameter_scope: scientific
    scientific_meaning: Fixed provider nucleus-sampling threshold.
    value_contract:
      type: number
      minimum: 0
      maximum: 1
    default: 1
  schedule:
    parameter_scope: scientific
    scientific_meaning: Exact iterative unmasking schedule.
    value_contract:
      type: string
      enum: [cosine, linear]
    default: cosine
  strategy:
    parameter_scope: scientific
    scientific_meaning: Exact token unmasking strategy.
    value_contract:
      type: string
      enum: [random, entropy]
    default: random
  temperature_annealing:
    parameter_scope: scientific
    scientific_meaning: Whether provider sampling temperature is annealed during unmasking.
    value_contract:
      type: boolean
    default: true
