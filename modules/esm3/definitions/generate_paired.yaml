schema_version: "2.1.0"
node_type_id: esm3.generate_paired
version: "7.0.0"
title: Generate paired sequences and structures with remote ESM-3
summary: Generates each sequence from a Prompt with at least one masked sequence residue, then samples exactly one structure-track counterpart from that terminal sequence.
category: generation
inputs:
  - name: protein_prompt
    port_type_id: protein.prompt
    port_type_version: "3.0.0"
    required: true
    multiplicity: one
    scientific_meaning: Complete residue-aligned conditioning Prompt with at least one masked sequence residue, preserved for sequence generation and each counterpart structure request.
outputs:
  - name: sequence_candidates
    port_type_id: candidate.collection
    port_type_version: "3.0.0"
    required: true
    multiplicity: one
    scientific_meaning: Ordered complete terminal sequence Candidates.
  - name: structure_candidates
    port_type_id: candidate.collection
    port_type_version: "3.0.0"
    required: true
    multiplicity: one
    scientific_meaning: Ordered complete structure Candidates with exact sequence-Candidate parents at the same sample slot.
  - name: counterpart_pairs
    port_type_id: candidate.pairing
    port_type_version: "3.0.0"
    required: true
    multiplicity: one
    scientific_meaning: Explicit one-to-one sequence-to-structure identity and content-digest mapping independent of collection order.
  - name: confidence_facts
    port_type_id: structure_prediction.confidence_facts
    port_type_version: "1.0.0"
    required: true
    multiplicity: one
    scientific_meaning: Subjectless provider confidence facts keyed one-to-one to structure_candidates, carrying the exact prediction-input axis, pTM, per-residue pLDDT, and optional PAE for later admitted-Candidate materialization.
  - name: sequence_reconstruction_candidates
    port_type_id: candidate.collection
    port_type_version: "3.0.0"
    required: false
    multiplicity: one
    scientific_meaning: Coordinate-conditioned prompt reconstructions returned by sequence calls, never sampled structure counterparts.
  - name: sequence_reconstruction_confidence_facts
    port_type_id: structure_prediction.confidence_facts
    port_type_version: "1.0.0"
    required: false
    multiplicity: one
    scientific_meaning: Subjectless provider confidence facts keyed one-to-one to sequence_reconstruction_candidates for later admitted-Candidate materialization.
parameter_groups:
  - id: generation
    title: Generation controls
    parameters:
      - effective_seed
      - num_samples
      - num_steps
      - temperature
      - top_p
      - schedule
      - strategy
      - temperature_annealing
node_parameters:
  effective_seed:
    parameter_scope: scientific
    scientific_meaning: Configured base seed used by Bindings with exact seed control; each controlled call derives its exact seed from canonical Prompt content and sample-track slot, while a provider-uncontrolled Binding records no effective seed.
    required: true
    value_contract:
      type: integer
      minimum: 0
      maximum: 9007199254740991
  num_samples:
    parameter_scope: scientific
    scientific_meaning: Exact ordered number of one-to-one sequence and structure counterpart samples.
    value_contract:
      type: integer
      minimum: 1
      maximum: 100
    default: 1
  num_steps:
    parameter_scope: scientific
    scientific_meaning: Requested upper bound on ESM-3 iterative unmasking steps for each track; the official SDK resolves an effective count independently for the sequence and structure calls from the encoded length and sampled positions.
    value_contract:
      type: integer
      minimum: 1
      maximum: 2048
    default: 20
  temperature:
    parameter_scope: scientific
    scientific_meaning: Fixed provider sampling temperature for both track operations.
    value_contract:
      type: number
      minimum: 0
      maximum: 10
    default: 1
  top_p:
    parameter_scope: scientific
    scientific_meaning: Fixed provider nucleus-sampling threshold for both track operations.
    value_contract:
      type: number
      minimum: 0
      maximum: 1
    default: 1
  schedule:
    parameter_scope: scientific
    scientific_meaning: Exact iterative unmasking schedule for both track operations.
    value_contract:
      type: string
      enum: [cosine, linear]
    default: cosine
  strategy:
    parameter_scope: scientific
    scientific_meaning: Exact token unmasking strategy for both track operations.
    value_contract:
      type: string
      enum: [random, entropy]
    default: random
  temperature_annealing:
    parameter_scope: scientific
    scientific_meaning: Whether provider sampling temperature is annealed during unmasking.
    value_contract:
      type: boolean
    default: true
