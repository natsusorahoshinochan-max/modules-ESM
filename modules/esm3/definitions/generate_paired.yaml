node_type_id: esm3.generate_paired
title: Generate paired sequences and structures with remote ESM-3
summary: Generates each sequence from a Prompt with at least one masked sequence residue, then samples exactly one structure-track counterpart from that terminal sequence.
category: generation
inputs:
  - name: protein_prompt
    port_type_id: protein.prompt
    required: true
    multiplicity: one
    scientific_meaning: Complete residue-aligned conditioning Prompt with at least one masked sequence residue, preserved for sequence generation and each counterpart structure request.
outputs:
  - name: sequence_candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Ordered complete terminal sequence Candidates.
  - name: structure_candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Ordered complete structure Candidates with exact sequence-Candidate parents at the same sample slot.
  - name: confidence_facts
    port_type_id: structure_prediction.confidence_facts
    required: true
    multiplicity: one
    scientific_meaning: Subjectless provider confidence facts keyed one-to-one to structure_candidates, carrying the exact prediction-input axis, pTM, per-residue pLDDT, and optional PAE for later admitted-Candidate materialization.
  - name: sequence_reconstruction_candidates
    port_type_id: candidate.collection
    required: false
    multiplicity: one
    scientific_meaning: Coordinate-conditioned prompt reconstructions returned by sequence calls, never sampled structure counterparts.
  - name: sequence_reconstruction_confidence_facts
    port_type_id: structure_prediction.confidence_facts
    required: false
    multiplicity: one
    scientific_meaning: Subjectless provider confidence facts keyed one-to-one to sequence_reconstruction_candidates for later admitted-Candidate materialization.
parameter_groups:
  - id: generation
    title: Generation controls
    parameters: [num_samples]
node_parameters:
  num_samples:
    parameter_scope: scientific
    scientific_meaning: Exact ordered number of generated samples.
    value_contract:
      type: integer
      minimum: 1
      maximum: 100
    default: 1
