schema_version: "2.1.0"
node_type_id: esm3.generate_structure
version: "2.1.0"
title: Generate structures with remote ESM-3
summary: Samples the structure track for one sequence-complete ProteinPrompt and publishes complete structures and exact confidence.
category: generation
inputs:
  - name: protein_prompt
    port_type_id: protein.prompt
    port_type_version: "2.1.0"
    required: true
    multiplicity: one
    scientific_meaning: Complete residue-aligned Prompt with an assigned sequence defining the generated structure residue axis.
outputs:
  - name: structure_candidates
    port_type_id: candidate.collection
    port_type_version: "2.1.0"
    required: true
    multiplicity: one
    scientific_meaning: Ordered complete sampled-structure Candidates.
  - name: confidence_observations
    port_type_id: score.collection
    port_type_version: "2.1.0"
    required: true
    multiplicity: one
    scientific_meaning: Exact intrinsic pTM and canonical per-residue and mean-residue pLDDT Observations.
  - name: pae_observations
    port_type_id: score.collection
    port_type_version: "2.1.0"
    required: false
    multiplicity: one
    scientific_meaning: Exact intrinsic provider PAE matrices when returned.
parameter_groups:
  - id: generation
    title: Generation controls
    parameters:
      - effective_seed
      - num_samples
      - num_steps
      - temperature
      - top_p
      - schedule
      - strategy
      - temperature_annealing
node_parameters:
  effective_seed:
    parameter_scope: scientific
    scientific_meaning: Fully resolved Workbench sampling identity; the remote provider does not expose seed control.
    required: true
    value_contract:
      type: integer
      minimum: 0
      maximum: 9007199254740991
  num_samples:
    parameter_scope: scientific
    scientific_meaning: Exact ordered number of provider samples.
    value_contract:
      type: integer
      minimum: 1
      maximum: 100
    default: 1
  num_steps:
    parameter_scope: scientific
    scientific_meaning: Exact number of ESM-3 iterative unmasking steps.
    value_contract:
      type: integer
      minimum: 1
      maximum: 2048
    default: 20
  temperature:
    parameter_scope: scientific
    scientific_meaning: Fixed provider sampling temperature.
    value_contract:
      type: number
      minimum: 0
      maximum: 10
    default: 1
  top_p:
    parameter_scope: scientific
    scientific_meaning: Fixed provider nucleus-sampling threshold.
    value_contract:
      type: number
      minimum: 0
      maximum: 1
    default: 1
  schedule:
    parameter_scope: scientific
    scientific_meaning: Exact iterative unmasking schedule.
    value_contract:
      type: string
      enum: [cosine, linear]
    default: cosine
  strategy:
    parameter_scope: scientific
    scientific_meaning: Exact token unmasking strategy.
    value_contract:
      type: string
      enum: [random, entropy]
    default: random
  temperature_annealing:
    parameter_scope: scientific
    scientific_meaning: Whether provider sampling temperature is annealed during unmasking.
    value_contract:
      type: boolean
    default: true
