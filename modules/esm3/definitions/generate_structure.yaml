node_type_id: esm3.generate_structure
title: Generate structures with remote ESM-3
summary: Samples the structure track for one sequence-complete ProteinPrompt and publishes complete structures and exact confidence.
category: generation
inputs:
  - name: protein_prompt
    port_type_id: protein.prompt
    required: true
    multiplicity: one
    scientific_meaning: Complete residue-aligned Prompt with an assigned sequence defining the generated structure residue axis.
outputs:
  - name: structure_candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Ordered complete sampled-structure Candidates.
  - name: confidence_facts
    port_type_id: structure_prediction.confidence_facts
    required: true
    multiplicity: one
    scientific_meaning: Subjectless provider confidence facts keyed one-to-one to structure_candidates, carrying the exact prediction-input axis, pTM, per-residue pLDDT, and optional PAE for later admitted-Candidate materialization.
parameter_groups:
  - id: generation
    title: Generation controls
    parameters: [num_samples]
node_parameters:
  num_samples:
    parameter_scope: scientific
    scientific_meaning: Exact ordered number of generated samples.
    value_contract:
      type: integer
      minimum: 1
      maximum: 100
    default: 1
