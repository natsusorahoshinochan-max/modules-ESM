node_type_id: esm3.represent_sequence
title: Represent a sequence
summary: Optionally computes the provider sequence-level mean embedding and actual per-residue logits.
category: representation
inputs:
  - name: sequence
    port_type_id: protein.sequence
    required: true
    multiplicity: one
    scientific_meaning: One complete canonical protein sequence whose residue order is preserved exactly.
outputs:
  - name: representation
    port_type_id: esm3.esmc_sequence_representation
    required: true
    multiplicity: one
    scientific_meaning: Requested mean embedding and/or actual residue-aligned logits; unrequested values are null. Logits are not probabilities.
parameter_groups:
  - id: outputs
    title: Outputs
    parameters: [outputs]
node_parameters:
  outputs:
    parameter_scope: scientific
    scientific_meaning: Select the provider values to request and persist.
    required: false
    default: both
    value_contract:
      type: string
      enum: [embedding, logits, both]
