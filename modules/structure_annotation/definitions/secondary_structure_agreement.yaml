node_type_id: structure_annotation.secondary_structure_agreement
title: Observe secondary-structure agreement
summary: Observes exact SS8 agreement for one identified subject against one identified reference on one identical residue layout.
category: structure_annotation
inputs:
  - name: references
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Exactly one reference Candidate that supplied the expected annotation.
  - name: expected
    port_type_id: structure_annotation.secondary_structure.observed
    required: true
    multiplicity: one
    scientific_meaning: Expected exact SS8 values explicitly associated with the admitted reference Candidate and carrying the comparison residue layout.
  - name: observed
    port_type_id: structure_annotation.secondary_structure.observed
    required: true
    multiplicity: one
    scientific_meaning: Observed exact SS8 values explicitly associated with the admitted subject Candidate and carrying the same comparison residue layout.
  - name: subject_residue_axes
    port_type_id: structure_transform.candidate_resolved_residue_axis_associations
    required: true
    multiplicity: one
    scientific_meaning: Exactly one authoritative resolved residue axis whose exact subject reference identifies the observed subject Candidate; its exact scalar axis identity and layout are attached to the emitted Observation. A different entry count fails before the engine is invoked.
outputs:
  - name: scores
    port_type_id: score.collection
    required: true
    multiplicity: one
    scientific_meaning: One typed pairwise secondary-structure agreement Observation for the exact subject and reference Candidates, carrying the exact residue layout on which agreement was computed.
parameter_groups: []
node_parameters: {}
