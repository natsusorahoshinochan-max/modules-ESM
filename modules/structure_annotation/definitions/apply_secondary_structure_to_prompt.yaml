schema_version: "2.1.0"
node_type_id: structure_annotation.apply_secondary_structure_to_prompt
version: "5.0.0"
title: Apply annotation secondary structure to ProteinPrompt
summary: Converts exact observed annotation SS8 values into ProteinPrompt conditioning without changing the Prompt layout or any other track.
category: structure_annotation
inputs:
  - name: protein_prompt
    port_type_id: protein.prompt
    port_type_version: "3.0.0"
    required: true
    multiplicity: one
    scientific_meaning: ProteinPrompt whose secondary-structure conditioning track will be replaced while all other fields remain byte-equivalent.
  - name: secondary_structure_track
    port_type_id: structure_annotation.secondary_structure_track
    port_type_version: "4.0.0"
    required: true
    multiplicity: one
    scientific_meaning: Candidate-associated observed SS8 annotation on the exact same residue layout; C becomes Prompt coil '-' and unavailable '_' becomes unspecified null. Candidate attribution is not copied into ProteinPrompt.
outputs:
  - name: protein_prompt
    port_type_id: protein.prompt
    port_type_version: "3.0.0"
    required: true
    multiplicity: one
    scientific_meaning: ProteinPrompt carrying the converted secondary-structure conditioning track on its unchanged exact layout.
parameter_groups: []
node_parameters: {}
