node_type_id: structure_annotation.dssp_compute
title: Compute DSSP annotations
summary: Runs the exact bound DSSP binary and reconciles its annotations to the authoritative resolved structure residue axis, emitting two observed tracks.
category: structure_annotation
inputs:
  - name: residue_axes
    port_type_id: structure_transform.candidate_resolved_residue_axis_associations
    required: true
    multiplicity: one
    scientific_meaning: Exactly one authoritative resolved residue axis whose exact subject reference identifies the annotation subject; this axis alone defines residue identity, order, and layout, while its embedded exact structure is the sole mkdssp request value. A different entry count fails before the engine is invoked.
outputs:
  - name: secondary_structure
    port_type_id: structure_annotation.secondary_structure.observed
    required: true
    multiplicity: one
    scientific_meaning: Observed canonical SS8 secondary structure (HBEGITSC) with per-residue null for missing residues, carrying the authoritative residue layout and the exact admitted ProteinStructure Candidate reference.
  - name: sasa
    port_type_id: structure_annotation.sasa.observed
    required: true
    multiplicity: one
    scientific_meaning: Observed absolute per-residue solvent-accessible surface area in square angstroms with per-residue null for unavailable residues, carrying the authoritative residue layout and the exact admitted ProteinStructure Candidate reference.
parameter_groups: []
node_parameters: {}
