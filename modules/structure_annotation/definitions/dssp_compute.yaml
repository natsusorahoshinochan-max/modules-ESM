node_type_id: structure_annotation.dssp_compute
title: Compute DSSP annotations
summary: Runs the exact bound DSSP binary and reconciles its annotations to the authoritative resolved structure residue axis.
category: structure_annotation
inputs:
  - name: structure_candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Exactly one ProteinStructure Candidate whose admitted candidate ID, data type, and content digest identify the annotation subject.
  - name: residue_axes
    port_type_id: structure_transform.candidate_resolved_residue_axis_associations
    required: true
    multiplicity: one
    scientific_meaning: Exactly one authoritative resolved residue axis associated by the complete admitted ProteinStructure Candidate reference; this axis alone defines residue identity, order, and layout, while its embedded exact structure is the sole mkdssp request value.
outputs:
  - name: annotations
    port_type_id: structure_annotation.dssp_annotations
    required: true
    multiplicity: one
    scientific_meaning: DSSP secondary structure and SASA for the complete authoritative axis, with each provider label_asym_id and label_seq_id pair joined through atom_site auth_asym_id, auth_seq_id, and pdbx_PDB_ins_code to the exact authored chain, signed residue number, and insertion code; explicitly associated with the admitted ProteinStructure Candidate reference.
parameter_groups: []
node_parameters: {}
