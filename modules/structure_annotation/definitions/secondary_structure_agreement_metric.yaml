metric_id: structure_annotation.secondary_structure_agreement
title: Secondary-structure agreement
description: Equal-weight fraction of residues with identical present SS8 annotations after exact observed-track-to-subject and expected-track-to-reference Candidate identity binding on the exact resolved subject structure residue axis.
value_shape: scalar
unit: dimensionless
direction: higher_is_better
canonical_range:
  minimum: 0
  maximum: 1
granularity: candidate
aggregation_semantics:
  kind: equal_weight_fraction
  source_metric: structure_annotation.secondary_structure.position_agreement
  included_values: residues_with_present_exact_SS8_on_both_tracks
observation_context_schema:
  type: object
  properties:
    kind:
      const: pairwise
    subject_role:
      const: subject
    reference_role:
      const: reference
    pairing_mode:
      const: fixed_reference
    normalization:
      const: exact-SS8-present-residue
  required:
    - kind
    - subject_role
    - reference_role
    - pairing_mode
    - normalization
  additionalProperties: false
validation_contract:
  finite: true
