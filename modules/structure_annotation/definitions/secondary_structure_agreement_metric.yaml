schema_version: "2.1.0"
metric_id: structure_annotation.secondary_structure_agreement
version: "2.1.0"
title: Secondary-structure agreement
description: Fraction of residues with identical present SS8 annotations for one exact subject-reference comparison on one residue layout.
value_shape: scalar
unit: dimensionless
direction: higher_is_better
canonical_range:
  minimum: 0
  maximum: 1
granularity: candidate
aggregation_semantics:
  kind: none
observation_context_schema:
  type: object
  properties:
    kind:
      const: pairwise
    subject_role:
      const: subject
    reference_role:
      const: reference
    pairing_mode:
      const: fixed_reference
    normalization:
      const: exact-SS8-present-residue
  required:
    - kind
    - subject_role
    - reference_role
    - pairing_mode
    - normalization
  additionalProperties: false
validation_contract:
  finite: true
