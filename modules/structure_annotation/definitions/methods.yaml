- method_id: structure_annotation.secondary_structure_agreement.method
  algorithm_identity: {absent_policy: exclude, alphabet: HBEGITSC,
    coarse_conversion: none, name: exact-SS8-present-residue-agreement}
  model_identity: {kind: none}
  featurization_identity:
    inputs: expected and observed candidate-associated SS8 tracks
    layout: exact_identity
    participant_binding:
      expected: exact admitted reference Candidate reference
      observed: exact admitted subject Candidate reference
    presence_mask: both-values-not-null
  scale_contract: {kind: identity}
- method_id: structure_annotation.observed_to_conditioning.method
  algorithm_identity:
    layout: exact_identity
    name: exact-observed-annotation-to-residue-conditioning
    provenance_transition: observed_annotation_to_residue_conditioning
    candidate_attribution: dropped
    rebuild_prompt: false
    unaffected: layout and values are preserved byte-equivalent
  model_identity: {kind: none}
  featurization_identity:
    inputs: [one observed candidate-associated annotation track]
    layout: exact_identity
    output: residue.condition track
    track: secondary_structure or sasa
  scale_contract: {kind: identity}
- method_id: structure_annotation.expected_secondary_structure_from_prompt.method
  algorithm_identity:
    layout: exact_identity
    name: exact-ProteinPrompt-conditioning-to-expected-observed-SS8
    provenance_transition: prompt_conditioning_to_expected_annotation
    source_alphabet: GHITEBS-
    source_missing_role: prompt_unspecified
    symbol_mapping: {'-': C, GHITEBS: identity, 'null': null}
    target_alphabet: HBEGITSC
    target_missing_role: expected_comparison_excluded
  model_identity: {kind: none}
  featurization_identity:
    inputs: [ProteinPrompt, singleton reference Candidate]
    layout: exact_identity
    output: candidate-associated secondary-structure observed track
    output_role: expected_comparison
    participant_binding: exact admitted reference Candidate reference
    track: secondary_structure
  scale_contract: {kind: identity}
