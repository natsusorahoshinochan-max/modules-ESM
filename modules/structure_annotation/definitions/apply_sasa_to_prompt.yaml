schema_version: "2.1.0"
node_type_id: structure_annotation.apply_sasa_to_prompt
version: "5.0.0"
title: Apply DSSP SASA to ProteinPrompt
summary: Copies exact absolute solvent-accessible surface areas in square angstroms into ProteinPrompt conditioning without changing the Prompt layout or any other track.
category: structure_annotation
inputs:
  - name: protein_prompt
    port_type_id: protein.prompt
    port_type_version: "3.0.0"
    required: true
    multiplicity: one
    scientific_meaning: ProteinPrompt whose SASA conditioning track will be replaced while all other fields remain byte-equivalent.
  - name: sasa_track
    port_type_id: structure_annotation.sasa_track
    port_type_version: "4.0.0"
    required: true
    multiplicity: one
    scientific_meaning: Candidate-associated observed absolute solvent-accessible surface areas in square angstroms on the exact same residue layout, with null for unavailable residues. Candidate attribution is not copied into ProteinPrompt.
outputs:
  - name: protein_prompt
    port_type_id: protein.prompt
    port_type_version: "3.0.0"
    required: true
    multiplicity: one
    scientific_meaning: ProteinPrompt carrying numerically unchanged square-angstrom SASA conditioning values on its unchanged exact layout.
parameter_groups: []
node_parameters: {}
