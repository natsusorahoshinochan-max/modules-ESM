module_id: scoring.ss_agreement
version: 1.0.0
display_name: Secondary Structure Agreement
category: scoring
description: "Compares expected vs observed secondary structure tracks and computes agreement score."
input_ports:
  - name: expected
    type_id: residue.track.secondary_structure
    display_name: Expected
    description: "Expected secondary structure track (e.g., from target specification)."
  - name: observed
    type_id: residue.track.secondary_structure
    display_name: Observed
    description: "Observed secondary structure track (e.g., from DSSP)."
output_ports:
  - name: scores
    type_id: score.collection
    display_name: Scores
    description: "Agreement scores: overlap fraction, per-residue match array."
module_api: "1.0"
