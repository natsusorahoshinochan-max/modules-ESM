module_id: compute.dssp
version: 1.0.0
display_name: DSSP
category: scoring
description: "Runs mkdssp on a protein structure to compute per-residue secondary structure codes. Uses async subprocess with configurable timeout."
input_ports:
  - name: structure
    type_id: protein.structure
    display_name: Structure
    description: "Protein structure to analyze with DSSP."
output_ports:
  - name: secondary_structure_track
    type_id: residue.track.secondary_structure
    display_name: Secondary Structure
    description: "Per-residue DSSP secondary structure codes."
parameters:
  - name: dssp_binary
    type: string
    default: "/opt/homebrew/bin/mkdssp"
    display_name: DSSP Binary
    description: "Path to the mkdssp executable."
  - name: timeout
    type: int
    default: 30
    min: 1
    display_name: Timeout
    description: "Maximum seconds to wait for mkdssp before failing."
module_api: "1.0"
