module_id: esm3.generate_sequence
version: 1.0.0
display_name: ESM3 Generate Sequence
category: model
description: "Generates protein sequences from a ProteinPrompt using ESM3."
input_ports:
  - name: protein_prompt
    type_id: protein.prompt
    display_name: ProteinPrompt
    description: "Multi-track protein prompt for ESM3 conditioning."
output_ports:
  - name: candidates
    type_id: candidate.collection
    display_name: Candidates
    description: "Generated sequence candidates."
  - name: scores
    type_id: score.collection
    display_name: Scores
    description: "Confidence scores for generated sequences."
parameters:
  - name: model_name
    type: enum
    default: "esm3-medium-2024-08"
    display_name: Model
    description: "ESM3 model to use."
    options:
      - "esm3-medium-2024-08"
      - "esm3-open-2024-03"
      - "esm3_sm_open_v1"
  - name: num_steps
    type: int
    default: 20
    min: 1
    display_name: Num Steps
    description: "Number of generation steps."
  - name: temperature
    type: float
    default: 1.0
    min: 0.0
    display_name: Temperature
    description: "Sampling temperature."
  - name: top_p
    type: float
    default: 1.0
    min: 0.0
    max: 1.0
    display_name: Top P
    description: "Top-p sampling threshold."
  - name: num_samples
    type: int
    default: 1
    min: 1
    display_name: Num Samples
    description: "Number of sequences to generate."
module_api: "1.0"
