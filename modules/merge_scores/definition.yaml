module_id: scoring.merge
version: 1.0.0
display_name: Merge Scores
category: scoring
description: "Merges multiple ScoreCollections into one by concatenating entries."
input_ports:
  - name: scores_a
    type_id: score.collection
    display_name: Scores A
    description: "First ScoreCollection to merge."
  - name: scores_b
    type_id: score.collection
    display_name: Scores B
    description: "Second ScoreCollection to merge."
  - name: scores_c
    type_id: score.collection
    display_name: Scores C
    description: "Third ScoreCollection to merge (optional)."
output_ports:
  - name: scores
    type_id: score.collection
    display_name: Merged Scores
    description: "Concatenated ScoreCollection with all entries preserved."
module_api: "1.0"
