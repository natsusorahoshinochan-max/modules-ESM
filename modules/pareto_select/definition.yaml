module_id: selection.pareto
version: 1.0.0
display_name: Pareto Select
category: selection
description: "Returns non-dominated candidates across multiple scores (all maximized)."
input_ports:
  - name: candidates
    type_id: candidate.collection
    display_name: Candidates
    description: "CandidateCollection to filter."
  - name: scores
    type_id: score.collection
    display_name: Scores
    description: "ScoreCollection with scores for each candidate."
output_ports:
  - name: candidates
    type_id: candidate.collection
    display_name: Pareto-Optimal Candidates
    description: "Non-dominated candidates on the specified scores."
parameters:
  - name: scores_list
    type: string
    default: "[]"
    display_name: Score IDs
    description: "JSON list of score_ids to consider for Pareto optimality."
module_api: "1.0"
