module_id: selection.diversity
version: 1.0.0
display_name: Diversity Select
category: selection
description: "Selects K candidates that maximize coverage of the score landscape, avoiding clusters."
input_ports:
  - name: candidates
    type_id: candidate.collection
    display_name: Candidates
    description: "CandidateCollection to select from."
  - name: scores
    type_id: score.collection
    display_name: Scores
    description: "ScoreCollection with scores for each candidate."
output_ports:
  - name: candidates
    type_id: candidate.collection
    display_name: Diverse Candidates
    description: "K candidates with diverse score values."
parameters:
  - name: k
    type: int
    default: 10
    min: 1
    display_name: K
    description: "Number of diverse candidates to select."
  - name: diversity_score
    type: string
    default: "plddt"
    display_name: Diversity Score
    description: "Score ID to use for diversity spread."
module_api: "1.0"
