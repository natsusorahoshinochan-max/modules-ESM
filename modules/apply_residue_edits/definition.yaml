module_id: prompt.apply_residue_edits
version: 1.0.0
display_name: Apply Residue Edits
category: prompt
description: "Apply edit operations (insert, delete, set, mask) to map a template structure onto a target residue layout."
input_ports:
  - name: template_structure
    type_id: protein.structure
    display_name: Template Structure
    description: "Template protein structure to map from."
  - name: target_layout
    type_id: residue.layout
    display_name: Target Layout
    description: "Target residue layout to map to."
output_ports:
  - name: sequence_track
    type_id: residue.track
    display_name: Sequence Track
    description: "Per-residue amino acid assignments."
  - name: structure_track
    type_id: residue.track
    display_name: Structure Track
    description: "Per-residue 3D coordinates."
  - name: visibility_track
    type_id: residue.track
    display_name: Visibility Track
    description: "Per-residue structure visibility."
  - name: residue_map
    type_id: residue.map
    display_name: Residue Map
    description: "Mapping from template to target residues."
parameters:
  - name: edits
    type: str
    default: "[]"
    display_name: Edits
    description: "JSON list of edit operations."
module_api: "1.0"
