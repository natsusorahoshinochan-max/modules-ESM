node_type_id: selection.filter
title: Filter Candidates with grouped conditions
summary: Retains original Candidates whose exact canonical Metric values satisfy an explicit grouped AND/OR expression.
category: selection
inputs:
  - name: candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Exact Candidate subjects shared by all declared Workflow Observation Selectors.
  - name: scores
    port_type_id: score.collection
    required: true
    multiplicity: many
    scientific_meaning: Exact partitioned Observation sources resolved in the declared Selector order.
outputs:
  - name: candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Original Candidate identities satisfying the complete grouped condition, in original relative order.
parameter_groups: []
node_parameters:
  selector_ids:
    parameter_scope: scientific
    scientific_meaning: Ordered exact Workflow Observation Selectors; expression indices refer to this array.
    required: true
    value_contract:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
  expression:
    parameter_scope: scientific
    scientific_meaning: Postfix grouped conditions over canonical Metric values; comparisons push one predicate and AND/OR combine the preceding operand_count predicates into one result.
    required: true
    value_contract:
      type: array
      minItems: 1
      items:
        oneOf:
          - type: object
            additionalProperties: false
            required: [selector_index, operator, threshold]
            properties:
              selector_index:
                field_scope: scientific
                scientific_meaning: Zero-based position in the ordered exact Workflow Observation Selector list.
                type: integer
                minimum: 0
              operator:
                field_scope: scientific
                scientific_meaning: Exact scalar comparison on canonical Metric values.
                type: string
                enum: [">", ">=", "<", "<=", "==", "!="]
              threshold:
                field_scope: scientific
                scientific_meaning: Scalar comparison threshold in the exact Metric canonical unit.
                type: number
          - type: object
            additionalProperties: false
            required: [operator, operand_count]
            properties:
              operator:
                field_scope: scientific
                scientific_meaning: Boolean conjunction or disjunction of the explicitly grouped preceding predicates.
                type: string
                enum: [and, or]
              operand_count:
                field_scope: scientific
                scientific_meaning: Number of preceding predicate results combined by this explicit group.
                type: integer
                minimum: 2
  out_of_scope_policy:
    parameter_scope: scientific
    scientific_meaning: Treatment of Observations outside the union of declared exact Selectors for their Score source.
    value_contract:
      type: string
      enum: [error, ignore]
    default: error
