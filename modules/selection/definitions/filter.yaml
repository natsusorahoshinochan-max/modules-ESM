node_type_id: selection.filter
title: Filter Candidates by one exact Observation selector
summary: Retains original Candidates whose one exact scoped canonical Metric value satisfies a declared comparison.
category: selection
inputs:
  - name: candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Exact Candidate subjects named by the selected Workflow objective.
  - name: scores
    port_type_id: score.collection
    required: true
    multiplicity: one
    scientific_meaning: Exact partitioned Observation source named by the selected Workflow objective.
outputs:
  - name: candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Original Candidate identities that satisfy the declared exact scalar condition in original relative order.
parameter_groups: []
node_parameters:
  selector_id:
    parameter_scope: scientific
    scientific_meaning: Exact Workflow-owned Observation Selector whose Candidate, raw Metric, Method, Context, cardinality, and missing policy contracts are consumed.
    required: true
    value_contract:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
  operator:
    parameter_scope: scientific
    scientific_meaning: Exact comparison applied to the canonical scalar Metric value and declared threshold.
    required: true
    value_contract:
      type: string
      enum: [">", ">=", "<", "<=", "==", "!="]
  threshold:
    parameter_scope: scientific
    scientific_meaning: Finite canonical scalar Metric threshold interpreted only under the selected exact Metric Definition.
    required: true
    value_contract:
      type: number
  out_of_scope_policy:
    parameter_scope: scientific
    scientific_meaning: Declared treatment of Observations outside the exact Candidate, partition, Metric, Method, and Context selector.
    value_contract:
      type: string
      enum: ["error", "ignore"]
    default: "error"
  tie_policy:
    parameter_scope: scientific
    scientific_meaning: Stable resolution contract shared by deterministic selection operations.
    value_contract:
      type: string
      const: "candidate_id_ascending"
    default: "candidate_id_ascending"
