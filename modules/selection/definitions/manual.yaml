node_type_id: selection.manual
title: Select checked Candidates
summary: Retains exact saved Candidate Data References from the current input; a missing reference fails the selection.
category: selection
inputs:
  - name: candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Current Candidate population in which every saved exact reference must exist.
outputs:
  - name: candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Checked original Candidate objects, preserving their relative current input order, exact data, metadata and lineage.
parameter_groups: []
node_parameters:
  selected_candidates:
    parameter_scope: scientific
    scientific_meaning: Exact Candidate identity, nominal data type and canonical content digest for every checked Candidate; no old Run lookup or substitution is performed.
    required: true
    value_contract:
      type: array
      uniqueItems: true
      items:
        type: object
        additionalProperties: false
        required: [candidate_id, data_type_id, content_digest]
        properties:
          candidate_id:
            field_scope: scientific
            scientific_meaning: Exact run-independent Candidate identity selected from the current input.
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_.:/+-]{0,127}$"
          data_type_id:
            field_scope: scientific
            scientific_meaning: Exact nominal scientific Port Type of the selected Candidate data.
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_.:/+-]{0,127}$"
          content_digest:
            field_scope: scientific
            scientific_meaning: Canonical content digest of the selected Candidate data, rejecting a changed payload under the same Candidate identity.
            type: string
            pattern: '^sha256:[0-9a-f]{64}$'
