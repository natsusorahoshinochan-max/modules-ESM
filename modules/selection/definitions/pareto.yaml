schema_version: "2.1.0"
node_type_id: selection.pareto
version: "2.1.0"
title: Select the Pareto frontier of explicit Utilities
summary: Retains Candidates not dominated across exact registered dimensionless Utility objectives.
category: selection
inputs:
  - name: candidates
    port_type_id: candidate.collection
    port_type_version: "2.1.0"
    required: true
    multiplicity: one
    scientific_meaning: Exact Candidate subjects shared by every selected Workflow objective.
  - name: scores
    port_type_id: score.collection
    port_type_version: "2.1.0"
    required: true
    multiplicity: one
    scientific_meaning: Exact Score Collection source shared by every selected Workflow objective, with scopes isolated by the objective contracts.
outputs:
  - name: candidates
    port_type_id: candidate.collection
    port_type_version: "2.1.0"
    required: true
    multiplicity: one
    scientific_meaning: Original non-dominated Candidate identities in deterministic identity order.
parameter_groups: []
node_parameters:
  objective_ids:
    parameter_scope: scientific
    scientific_meaning: Ordered unique IDs of exact Workflow-owned Selection Objectives whose registered dimensionless Utilities define Pareto dominance.
    required: true
    value_contract:
      type: array
      minItems: 1
      maxItems: 128
      uniqueItems: true
      items:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
  tie_policy:
    parameter_scope: scientific
    scientific_meaning: Stable final ordering independent of Run identity, Cache replay, process hash order, and input order.
    value_contract:
      type: string
      const: "candidate_id_ascending"
    default: "candidate_id_ascending"
