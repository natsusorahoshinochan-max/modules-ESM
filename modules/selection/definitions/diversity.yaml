node_type_id: selection.diversity
title: Select Candidates by exact Utility-space diversity
summary: Applies the registered deterministic weighted max-min Euclidean Method to exact dimensionless Utility vectors.
category: selection
inputs:
  - name: candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Exact Candidate subjects shared by every selected Workflow objective.
  - name: scores
    port_type_id: score.collection
    required: true
    multiplicity: one
    scientific_meaning: Exact Score Collection source shared by every selected Workflow objective, with scopes isolated by the objective contracts.
outputs:
  - name: candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Original Candidate identities selected by the exact diversity Method in deterministic greedy order.
parameter_groups: []
node_parameters:
  objective_ids:
    parameter_scope: scientific
    scientific_meaning: Ordered unique IDs of exact Workflow-owned Selection Objectives whose registered dimensionless Utilities form the diversity space.
    required: true
    value_contract:
      type: array
      minItems: 1
      maxItems: 128
      uniqueItems: true
      items:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
  k:
    parameter_scope: scientific
    scientific_meaning: Positive number of diverse Candidates required from the exact runtime Candidate input.
    required: true
    value_contract:
      type: integer
      minimum: 1
      maximum: 2000000
  tie_policy:
    parameter_scope: scientific
    scientific_meaning: Stable resolution of equal aggregate Utilities and equal diversity distances.
    value_contract:
      type: string
      const: "candidate_id_ascending"
    default: "candidate_id_ascending"
