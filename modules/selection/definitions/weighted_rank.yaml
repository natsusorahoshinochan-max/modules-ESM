schema_version: "2.1.0"
node_type_id: selection.weighted_rank
version: "5.0.0"
title: Rank Candidates by explicit weighted Utilities
summary: Orders exact Candidates by normalized non-negative weights over registered dimensionless Utility Transforms.
category: selection
inputs:
  - name: candidates
    port_type_id: candidate.collection
    port_type_version: "4.0.0"
    required: true
    multiplicity: one
    scientific_meaning: Exact Candidate subjects shared by every selected Workflow objective.
  - name: scores
    port_type_id: score.collection
    port_type_version: "5.0.0"
    required: true
    multiplicity: one
    scientific_meaning: Exact Score Collection source shared by every selected Workflow objective, with scopes isolated by the objective contracts.
outputs:
  - name: candidates
    port_type_id: candidate.collection
    port_type_version: "4.0.0"
    required: true
    multiplicity: one
    scientific_meaning: Original Candidate identities ordered by descending normalized weighted Utility and deterministic identity ties.
parameter_groups: []
node_parameters:
  objective_ids:
    parameter_scope: scientific
    scientific_meaning: Ordered unique IDs of exact Workflow-owned Selection Objectives; raw Metric names, direction flags, and executable transforms are not accepted.
    required: true
    value_contract:
      type: array
      minItems: 1
      maxItems: 128
      uniqueItems: true
      items:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
  tie_policy:
    parameter_scope: scientific
    scientific_meaning: Stable final ordering independent of Run identity, Cache replay, process hash order, and input order.
    value_contract:
      type: string
      const: "candidate_id_ascending"
    default: "candidate_id_ascending"
