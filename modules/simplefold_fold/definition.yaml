module_id: simplefold.fold
version: 1.0.0
display_name: SimpleFold Fold
category: model
description: "Folds protein sequences into 3D structures using SimpleFold's lightweight 100M model."
input_ports:
  - name: sequence
    type_id: protein.sequence
    required: false
    display_name: Sequence
    description: "Single protein sequence to fold."
  - name: candidates
    type_id: candidate.collection
    required: false
    display_name: Candidates
    description: "Collection of sequence candidates to fold."
input_groups:
  - name: fold_input
    alternatives:
      - [sequence]
      - [candidates]
output_ports:
  - name: candidates
    type_id: candidate.collection
    display_name: Structures
    description: "Folded structure candidates with lineage."
  - name: scores
    type_id: score.collection
    display_name: Scores
    description: "Per-residue pLDDT scores from the forward pass."
parameters:
  - name: model_name
    type: enum
    default: "simplefold_100M"
    display_name: Model
    description: "SimpleFold model for folding."
    options:
      - "simplefold_100M"
  - name: num_steps
    type: int
    default: 50
    min: 1
    max: 50
    display_name: Num Steps
    description: "Number of denoising steps (capped at 50)."
  - name: num_samples
    type: int
    default: 1
    min: 1
    display_name: Num Samples
    description: "Number of structures to generate per sequence."
module_api: "1.0"
