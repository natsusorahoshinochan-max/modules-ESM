node_type_id: protein_io.import_structure
title: Import protein structure
summary: Selects one model from a trusted Project-scoped PDB or mmCIF input.
category: protein_io
inputs: []
outputs:
  - name: structure
    port_type_id: protein.structure
    required: true
    multiplicity: one
    scientific_meaning: One selected source model in its original PDB or mmCIF format.
  - name: structure_candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Singleton exact Candidate collection for reference-scoped collection operations.
parameter_groups:
  - id: project_input
    title: Project input
    parameters:
      - project_input_ref
      - model_index
node_parameters:
  project_input_ref:
    parameter_scope: scientific
    resource_kind: project_input
    scientific_meaning: Opaque identity of one trusted Project-scoped input.
    value_contract:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    required: true
  model_index:
    parameter_scope: scientific
    scientific_meaning: One-based source model position; required for files with multiple models. Null accepts only a single-model file.
    value_contract:
      type: [integer, 'null']
      minimum: 1
    default: null
