node_type_id: protein_io.export_structure
title: Export protein structure
summary: Serializes one protein structure as a validated Run-bound artifact.
category: protein_io
inputs:
  - name: structure
    port_type_id: protein.structure
    required: false
    multiplicity: one
    scientific_meaning: Protein structure to serialize in its declared source format.
  - name: structures
    port_type_id: candidate.collection
    required: false
    multiplicity: one
    scientific_meaning: Ordered protein structure Candidates to serialize without changing identity or source text.
input_constraints:
  - kind: exactly_one
    ports:
      - structure
      - structures
outputs:
  - name: standalone_artifact
    port_type_id: protein_io.artifact_payload
    required: false
    multiplicity: one
    scientific_meaning: Cache-safe native PDB bytes for opaque Run-bound publication.
    artifact_kind: standalone
    artifact_media_type: chemical/x-pdb
  - name: candidate_artifacts
    port_type_id: protein_io.artifact_payload
    required: false
    multiplicity: many
    scientific_meaning: Ordered Candidate-bound native PDB bytes for opaque Run-bound publication.
    artifact_kind: candidate
    artifact_media_type: chemical/x-pdb
  - name: standalone_mmcif_artifact
    port_type_id: protein_io.artifact_payload
    required: false
    multiplicity: one
    scientific_meaning: Original mmCIF bytes for opaque Run-bound publication.
    artifact_kind: standalone
    artifact_media_type: chemical/x-mmcif
  - name: candidate_mmcif_artifacts
    port_type_id: protein_io.artifact_payload
    required: false
    multiplicity: many
    scientific_meaning: Ordered Candidate-bound original mmCIF bytes.
    artifact_kind: candidate
    artifact_media_type: chemical/x-mmcif
parameter_groups: []
node_parameters: {}
