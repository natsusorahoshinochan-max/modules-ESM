node_type_id: protein_io.adopt_candidates
title: Adopted Candidates
summary: Restores explicitly adopted historical Candidates with their original identities and data.
category: protein_io
inputs: []
outputs:
  - name: value
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: The original published Candidates, without generating new objects.
parameter_groups: []
node_parameters:
  project_input_ref:
    parameter_scope: scientific
    resource_kind: project_input
    scientific_meaning: Independent immutable snapshot of the explicitly adopted result.
    value_contract:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    required: true
