node_type_id: protein_io.import_structures
title: Import structure conformers as Candidates
summary: Splits explicitly selected models from one PDB or mmCIF file into independent single-model Candidates.
category: protein_io
inputs: []
outputs:
  - name: structure_candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: One single-model Candidate per selected source model, preserving selection order and authored atom identities.
parameter_groups:
  - id: project_input
    title: Project input and conformers
    parameters: [project_input_ref, model_indices]
node_parameters:
  project_input_ref:
    parameter_scope: scientific
    resource_kind: project_input
    scientific_meaning: Opaque identity of one immutable PDB or mmCIF file.
    value_contract:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    required: true
  model_indices:
    parameter_scope: scientific
    scientific_meaning: Ordered unique one-based positions of source models to import separately.
    value_contract:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: integer
        minimum: 1
    required: true
