node_type_id: protein_io.import_sequences
title: Import FASTA records as independent Candidates
summary: Imports all records in source order without deduplicating names or sequences; an invalid record rejects the entire import.
category: protein_io
inputs: []
outputs:
  - name: sequence_candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: One independent protein sequence Candidate per FASTA record, preserving input order, header and source location with no upstream Candidate parent.
parameter_groups:
  - id: project_input
    title: Project input
    parameters: [project_input_ref]
node_parameters:
  project_input_ref:
    parameter_scope: scientific
    resource_kind: project_input
    scientific_meaning: Opaque identity of the immutable Project Input containing independent FASTA records.
    value_contract:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    required: true
