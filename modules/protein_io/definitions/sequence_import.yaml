schema_version: "2.1.0"
node_type_id: protein_io.import_sequence
version: "6.0.0"
title: Import protein sequence
summary: Parses one trusted Project-scoped sequence input.
category: protein_io
inputs: []
outputs:
  - name: sequence
    port_type_id: protein.sequence
    port_type_version: "3.0.0"
    required: true
    multiplicity: one
    scientific_meaning: Canonically validated imported protein sequence.
  - name: sequence_candidates
    port_type_id: candidate.collection
    port_type_version: "4.0.0"
    required: true
    multiplicity: one
    scientific_meaning: One imported sequence Candidate with no upstream Candidate parent and exact Project Input provenance through the producing result.
parameter_groups:
  - id: project_input
    title: Project input
    parameters:
      - project_input_ref
node_parameters:
  project_input_ref:
    parameter_scope: scientific
    resource_kind: project_input
    scientific_meaning: Opaque identity of one trusted Project-scoped input.
    value_contract:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    required: true
