module_id: structure.rmsd
version: 1.0.0
display_name: RMSD
category: scoring
description: "Reads RMSD directly from a StructureAlignment and emits it as a score entry."
input_ports:
  - name: alignment
    type_id: structure.alignment
    display_name: Alignment
    description: "Pre-computed StructureAlignment containing RMSD."
output_ports:
  - name: scores
    type_id: score.collection
    display_name: Scores
    description: "RMSD score entry in angstroms."
parameters:
  - name: candidate_id
    type: string
    default: ""
    display_name: Candidate ID
    description: "Candidate evaluated by this alignment. Required for candidate-bound scoring."
module_api: "1.0"
