node_type_id: collection_ops.pair_by_two_hop_ancestor
title: Pair Candidates with their exact two-hop ancestors
summary: Derives one exact ancestor reference per subject through its sole intermediate parent while allowing several subjects to share one ancestor.
category: collection_ops
inputs:
  - name: subjects
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Subject Candidates whose sole parent is one supplied intermediate Candidate.
  - name: intermediates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Intermediate Candidates whose sole parent is one supplied ancestor Candidate.
  - name: ancestors
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Exact ancestor Candidates referenced through the two-hop subject lineage.
outputs:
  - name: pairing
    port_type_id: candidate.direct_ancestor_pairing
    required: true
    multiplicity: one
    scientific_meaning: Complete subject-to-direct-ancestor mapping using full Candidate Data References, with one reference per subject and shared references allowed.
parameter_groups: []
node_parameters: {}
