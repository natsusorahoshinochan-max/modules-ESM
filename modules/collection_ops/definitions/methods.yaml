- method_id: collection_ops.concat_candidates.method
  algorithm_identity:
    name: concat_candidates
    input_partition_order: [candidates_a, candidates_b, candidates_c]
    identity_policy: exact-input-identity
    duplicate_policy: reject-candidate-partition-collision
  model_identity: {kind: none}
  featurization_identity: {kind: identity}
  scale_contract: {kind: identity}
- method_id: collection_ops.merge_scores.method
  algorithm_identity:
    name: merge_scores
    input_partition_order: [scores_a, scores_b, scores_c]
    identity_policy: exact-input-identity
    duplicate_policy: deduplicate-identical-observation-only
  model_identity: {kind: none}
  featurization_identity: {kind: identity}
  scale_contract: {kind: identity}
- method_id: collection_ops.concat_relations.method
  algorithm_identity:
    name: concat_relations
    input_partition_order: [relation_a, relation_b, relation_c]
    identity_policy: exact-candidate-data-reference
    duplicate_policy: reject-subject-partition-collision
  model_identity: {kind: none}
  featurization_identity: {kind: identity}
  scale_contract: {kind: identity}
- method_id: collection_ops.relate_by_parent.method
  algorithm_identity:
    name: relate_by_parent
    join: exact-declared-parent-identity
    cardinality: one-reference-per-subject-shared-reference-allowed
  model_identity: {kind: none}
  featurization_identity: {kind: identity}
  scale_contract: {kind: identity}
- method_id: collection_ops.relate_to_single_reference.method
  algorithm_identity:
    name: relate_to_single_reference
    join: explicit-single-reference
    cardinality: one-reference-per-subject-shared-reference-required
  model_identity: {kind: none}
  featurization_identity: {kind: identity}
  scale_contract: {kind: identity}
- method_id: collection_ops.compose_relations.method
  algorithm_identity:
    name: compose_relations
    join: left-reference-equals-right-subject
    cardinality: one-reference-per-subject-shared-reference-allowed
  model_identity: {kind: none}
  featurization_identity: {kind: identity}
  scale_contract: {kind: identity}
- method_id: collection_ops.invert_relation.method
  algorithm_identity:
    name: invert_relation
    mapping: swap-subject-and-reference
    cardinality: one-reference-per-subject
  model_identity: {kind: none}
  featurization_identity: {kind: identity}
  scale_contract: {kind: identity}
- method_id: collection_ops.join_relation_subjects.method
  algorithm_identity:
    name: join_relation_subjects
    join: shared-reference-equality
    cardinality: one-right-subject-per-shared-reference
  model_identity: {kind: none}
  featurization_identity: {kind: identity}
  scale_contract: {kind: identity}
- method_id: collection_ops.take_candidates.method
  algorithm_identity:
    name: take_candidates
    duplicate_policy: preserve-exact-ordered-prefix
  model_identity: {kind: none}
  featurization_identity: {kind: identity}
  scale_contract: {kind: identity}
- method_id: collection_ops.select_related_subjects.method
  algorithm_identity:
    name: select_related_subjects
    identity_policy: exact-candidate-data-reference
    duplicate_policy: preserve-subject-input-order
  model_identity: {kind: none}
  featurization_identity: {kind: identity}
  scale_contract: {kind: identity}
- method_id: collection_ops.intersect_candidates.method
  algorithm_identity:
    name: intersect_candidates
    input_partition_order: [candidates_a, candidates_b, candidates_c, candidates_d]
    identity_policy: exact-input-identity
    duplicate_policy: exact-candidate-equality
  model_identity: {kind: none}
  featurization_identity: {kind: identity}
  scale_contract: {kind: identity}
