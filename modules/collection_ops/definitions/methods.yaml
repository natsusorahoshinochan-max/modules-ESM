- method_id: collection_ops.concat_candidates.method
  algorithm_identity:
    name: concat_candidates
    input_partition_order:
    - candidates_a
    - candidates_b
    - candidates_c
    identity_policy: exact-input-identity
    duplicate_policy: reject-candidate-partition-collision
  model_identity:
    kind: none
  featurization_identity:
    kind: identity
  scale_contract:
    kind: identity
- method_id: collection_ops.merge_scores.method
  algorithm_identity:
    name: merge_scores
    input_partition_order:
    - scores_a
    - scores_b
    - scores_c
    identity_policy: exact-input-identity
    duplicate_policy: deduplicate-identical-observation-only
  model_identity:
    kind: none
  featurization_identity:
    kind: identity
  scale_contract:
    kind: identity
- method_id: collection_ops.concat_pairings.method
  algorithm_identity:
    name: concat_pairings
    input_partition_order:
    - pairing_a
    - pairing_b
    - pairing_c
    identity_policy: exact-input-identity
    duplicate_policy: reject-subject-or-reference-partition-collision
    pairing_contract:
      participant_identity: CandidateDataReference
      join: complete-reference-equality
      cardinality: one-to-one
  model_identity:
    kind: none
  featurization_identity:
    kind: identity
  scale_contract:
    kind: identity
- method_id: collection_ops.pair_siblings_by_parent.method
  algorithm_identity:
    name: pair_siblings_by_parent
    input_partition_order:
    - subjects
    - references
    identity_policy: exact-input-identity
    duplicate_policy: one-sibling-per-common-parent
    pairing_contract:
      participant_identity: CandidateDataReference
      join: complete-reference-equality
      cardinality: one-to-one
  model_identity:
    kind: none
  featurization_identity:
    kind: identity
  scale_contract:
    kind: identity
- method_id: collection_ops.rebind_candidate_pairing.method
  algorithm_identity:
    name: rebind_candidate_pairing
    input_partition_order:
    - subjects
    - parents
    - references
    - parent_pairing
    identity_policy: exact-input-identity
    duplicate_policy: complete-one-to-one-parent-composition
    pairing_contract:
      participant_identity: CandidateDataReference
      join: complete-reference-equality
      cardinality: one-to-one
  model_identity:
    kind: none
  featurization_identity:
    kind: identity
  scale_contract:
    kind: identity
- method_id: collection_ops.take_candidates.method
  algorithm_identity:
    name: take_candidates
    input_partition_order:
    - candidates
    identity_policy: exact-input-identity
    duplicate_policy: preserve-exact-ordered-prefix
  model_identity:
    kind: none
  featurization_identity:
    kind: identity
  scale_contract:
    kind: identity
- method_id: collection_ops.select_children_by_parent.method
  algorithm_identity:
    name: select_children_by_parent
    input_partition_order:
    - candidates
    - parents
    identity_policy: exact-input-identity
    duplicate_policy: exact-single-parent-membership
  model_identity:
    kind: none
  featurization_identity:
    kind: identity
  scale_contract:
    kind: identity
- method_id: collection_ops.intersect_candidates.method
  algorithm_identity:
    name: intersect_candidates
    input_partition_order:
    - candidates_a
    - candidates_b
    - candidates_c
    - candidates_d
    identity_policy: exact-input-identity
    duplicate_policy: exact-candidate-equality
  model_identity:
    kind: none
  featurization_identity:
    kind: identity
  scale_contract:
    kind: identity
