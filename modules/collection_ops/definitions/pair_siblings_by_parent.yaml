node_type_id: collection_ops.pair_siblings_by_parent
title: Pair sibling Candidates by common parent
summary: Creates one explicit subject-to-reference pairing from exact one-parent sibling lineage without using collection order.
category: collection_ops
inputs:
  - name: subjects
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Subject Candidates with exactly one parent each and exactly one subject for every shared parent.
  - name: references
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Reference Candidates with exactly one parent each and exactly one reference for every shared parent.
outputs:
  - name: pairing
    port_type_id: candidate.pairing
    required: true
    multiplicity: one
    scientific_meaning: Complete one-to-one subject-to-reference pairing keyed only by exact common parent identity, with both participants represented by full Candidate Data References.
parameter_groups: []
node_parameters: {}
