node_type_id: folding.fold
title: Fold protein sequences
summary: Folds each complete sequence Candidate through one explicitly selected folding Binding and publishes complete structure Candidates with canonical confidence.
category: folding
inputs:
  - name: sequence_candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Ordered complete protein sequence Candidates whose exact identities become parents of every folded sample.
outputs:
  - name: structure_candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Complete validated structure Candidates ordered by input parent then zero-based sample slot.
  - name: confidence_facts
    port_type_id: structure_prediction.confidence_facts
    required: true
    multiplicity: one
    scientific_meaning: Canonical subjectless prediction-confidence facts keyed to each structure output slot, exact structure content digest, exact prediction-input residue axis, and producing folding Method; a later materializer joins them to admitted structure Candidate references.
parameter_groups:
  - id: sampling
    title: Sampling controls
    parameters:
      - effective_seed
      - num_samples
node_parameters:
  effective_seed:
    parameter_scope: scientific
    scientific_meaning: Configured base seed used by Bindings with exact seed control; a controlled call derives its seed from canonical parent-sequence content and stable parent/sample semantics, while a provider-uncontrolled Binding records no effective seed.
    required: true
    value_contract:
      type: integer
      minimum: 0
      maximum: 9007199254740991
  num_samples:
    parameter_scope: scientific
    scientific_meaning: Exact ordered number of complete folded structures requested for each input parent.
    value_contract:
      type: integer
      minimum: 1
      maximum: 100
    default: 1
