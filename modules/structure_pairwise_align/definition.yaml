module_id: structure.pairwise_align
version: 1.1.0
display_name: Pairwise Structure Alignment
category: scoring
description: "Performs index-matched pairwise sequence-aware SVD alignment between two CandidateCollections of protein structures. Each reference[i] is aligned onto mobile[i]. Outputs reproducible StructureAlignment evidence with candidate IDs inherited from the reference collection."
input_ports:
  - name: reference
    type_id: protein.structure
    required: false
    display_name: Shared Reference
    description: "One reference ProteinStructure to align against every mobile candidate."
  - name: reference_candidates
    type_id: candidate.collection
    required: false
    display_name: Reference Candidates
    description: "Reference collection of ProteinStructure candidates (fixed side)."
  - name: mobile_candidates
    type_id: candidate.collection
    display_name: Mobile Candidates
    description: "Mobile collection of ProteinStructure candidates to align onto reference."
input_groups:
  - name: reference_input
    alternatives:
      - [reference]
      - [reference_candidates]
output_ports:
  - name: alignments
    type_id: candidate.collection
    display_name: Alignments
    description: "CandidateCollection of StructureAlignment evidence items, one per input pair."
module_api: "1.0"
