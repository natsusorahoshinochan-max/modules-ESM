PromptAuthoringChange:
  oneOf:
  - additionalProperties: false
    properties:
      action:
        enum:
        - insert
        - delete
      kind:
        const: residue
      residue_handle:
        $ref: '#/$defs/Identifier'
    required:
    - kind
    - action
    - residue_handle
    type: object
  - additionalProperties: false
    properties:
      action:
        enum:
        - insert
        - delete
      kind:
        const: track_presence
      track:
        enum:
        - sequence
        - coordinates
        - secondary_structure
        - sasa
    required:
    - kind
    - track
    - action
    type: object
  - additionalProperties: false
    properties:
      action:
        enum:
        - clear
        - replace
      kind:
        const: track_value
      residue_handle:
        $ref: '#/$defs/Identifier'
      track:
        enum:
        - sequence
        - coordinates
        - secondary_structure
        - sasa
    required:
    - kind
    - track
    - residue_handle
    - action
    type: object
  - additionalProperties: false
    properties:
      action:
        enum:
        - insert
        - delete
      annotation:
        additionalProperties: false
        properties:
          end_residue_handle:
            $ref: '#/$defs/Identifier'
          label:
            minLength: 1
            type: string
          start_residue_handle:
            $ref: '#/$defs/Identifier'
        required:
        - label
        - start_residue_handle
        - end_residue_handle
        type: object
      kind:
        const: function_annotation
    required:
    - kind
    - action
    - annotation
    type: object
  - additionalProperties: false
    properties:
      action:
        const: replace
      after_residue_handles:
        items:
          $ref: '#/$defs/Identifier'
        type: array
      before_residue_handles:
        items:
          $ref: '#/$defs/Identifier'
        type: array
      kind:
        const: residue_order
    required:
    - kind
    - action
    - before_residue_handles
    - after_residue_handles
    type: object
PromptAuthoringDocument:
  additionalProperties: false
  properties:
    chains:
      items:
        $ref: '#/$defs/PromptChainDeclaration'
      type: array
    function_annotations:
      items:
        $ref: '#/$defs/PromptFunctionAnnotationIntent'
      type: array
    random_operations:
      items:
        $ref: '#/$defs/PromptRandomOperation'
      type: array
    rigid_transforms:
      items:
        $ref: '#/$defs/PromptRigidTransform'
      type: array
    source_merges:
      items:
        $ref: '#/$defs/PromptSourceMerge'
      type: array
    target_residues:
      items:
        $ref: '#/$defs/PromptTargetResidue'
      type: array
    track_edits:
      items:
        $ref: '#/$defs/PromptTrackEdit'
      type: array
  type: object
PromptAuthoringOpenRequest:
  additionalProperties: false
  properties:
    node_id:
      $ref: '#/$defs/NodeInstanceId'
    project_id:
      $ref: '#/$defs/ProjectId'
    workflow:
      $ref: '#/$defs/WorkflowDocument'
  required:
  - project_id
  - node_id
  type: object
PromptAuthoringPreview:
  additionalProperties: false
  properties:
    baseline_diagnostics:
      items:
        $ref: '#/$defs/PromptDiagnostic'
      type: array
    changes:
      items:
        $ref: '#/$defs/PromptAuthoringChange'
      type: array
    diagnostics:
      items:
        $ref: '#/$defs/PromptDiagnostic'
      type: array
    function_annotations:
      items:
        $ref: '#/$defs/PromptFunctionAnnotationProjection'
      type: array
    merge_targets:
      items:
        $ref: '#/$defs/PromptMergeTarget'
      type: array
    normalized_document:
      $ref: '#/$defs/PromptAuthoringDocument'
    random_selections:
      items:
        $ref: '#/$defs/PromptRandomSelection'
      type: array
    residues:
      items:
        $ref: '#/$defs/PromptResidueProjection'
      type: array
    source_merges:
      items:
        $ref: '#/$defs/PromptMergeProjection'
      type: array
    summary:
      $ref: '#/$defs/PromptSummary'
    tool_projections:
      items:
        additionalProperties: false
        properties:
          projection_id:
            type: string
          title:
            type: string
          value:
            type: object
        required:
        - projection_id
        - title
        - value
        type: object
      type: array
    tracks:
      $ref: '#/$defs/PromptTrackProjectionSet'
  required:
  - normalized_document
  - residues
  - tracks
  - function_annotations
  - changes
  - random_selections
  - source_merges
  - diagnostics
  - summary
  - baseline_diagnostics
  - tool_projections
  - merge_targets
  type: object
PromptAuthoringPreviewRequest:
  additionalProperties: false
  properties:
    document:
      $ref: '#/$defs/PromptAuthoringDocument'
    node_id:
      $ref: '#/$defs/NodeInstanceId'
    project_id:
      $ref: '#/$defs/ProjectId'
    version_context:
      $ref: '#/$defs/PromptVersionContext'
    workflow:
      $ref: '#/$defs/WorkflowDocument'
  required:
  - project_id
  - node_id
  - document
  type: object
PromptAuthoringSnapshot:
  additionalProperties: false
  properties:
    baseline_diagnostics:
      items:
        $ref: '#/$defs/PromptDiagnostic'
      type: array
    document:
      $ref: '#/$defs/PromptAuthoringDocument'
    draft_revision:
      minimum: 0
      type: integer
    function_annotations:
      items:
        $ref: '#/$defs/PromptFunctionAnnotationProjection'
      type: array
    merge_targets:
      items:
        $ref: '#/$defs/PromptMergeTarget'
      type: array
    random_selections:
      items:
        $ref: '#/$defs/PromptRandomSelection'
      type: array
    residues:
      items:
        $ref: '#/$defs/PromptResidueProjection'
      type: array
    source:
      $ref: '#/$defs/PromptSourceFacts'
    tool_projections:
      items:
        additionalProperties: false
        properties:
          projection_id:
            type: string
          title:
            type: string
          value:
            type: object
        required:
        - projection_id
        - title
        - value
        type: object
      type: array
    tracks:
      $ref: '#/$defs/PromptTrackProjectionSet'
  required:
  - document
  - residues
  - tracks
  - function_annotations
  - source
  - baseline_diagnostics
  - random_selections
  - tool_projections
  - merge_targets
  - draft_revision
  type: object
PromptChainDeclaration:
  additionalProperties: false
  properties:
    chain_id:
      pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
      type: string
    length:
      maximum: 2000000
      minimum: 1
      type: integer
  required:
  - chain_id
  - length
  type: object
PromptCoordinatesProjectionValue:
  additionalProperties: false
  properties:
    atoms:
      items:
        additionalProperties: false
        properties:
          atom_handle:
            $ref: '#/$defs/Identifier'
          atom_name:
            type: string
          coordinates:
            items:
              type: number
            maxItems: 3
            minItems: 3
            type: array
        required:
        - atom_handle
        - atom_name
        - coordinates
        type: object
      type: array
  required:
  - atoms
  type: object
PromptCorrespondenceRow:
  oneOf:
  - additionalProperties: false
    properties:
      disposition:
        const: match
      source_residue_id:
        minLength: 1
        type: string
      target_residue_id:
        minLength: 1
        type: string
    required:
    - disposition
    - source_residue_id
    - target_residue_id
    type: object
  - additionalProperties: false
    properties:
      disposition:
        const: source_gap
      source_residue_id:
        minLength: 1
        type: string
    required:
    - disposition
    - source_residue_id
    type: object
  - additionalProperties: false
    properties:
      disposition:
        const: target_gap
      target_residue_id:
        minLength: 1
        type: string
    required:
    - disposition
    - target_residue_id
    type: object
  - additionalProperties: false
    properties:
      disposition:
        const: insert
      source_residue_id:
        minLength: 1
        type: string
      target_residue_id:
        minLength: 1
        type: string
    required:
    - disposition
    - source_residue_id
    - target_residue_id
    type: object
PromptDiagnostic:
  additionalProperties: false
  properties:
    code:
      $ref: '#/$defs/Identifier'
    field_path:
      items:
        oneOf:
        - type: string
        - type: integer
      type: array
    message:
      type: string
    residue_handle:
      $ref: '#/$defs/Identifier'
  required:
  - code
  - message
  - field_path
  type: object
PromptFunctionAnnotationIntent:
  additionalProperties: false
  properties:
    end_residue_id:
      minLength: 1
      type: string
    label:
      maxLength: 256
      minLength: 1
      type: string
    start_residue_id:
      minLength: 1
      type: string
  required:
  - label
  - start_residue_id
  - end_residue_id
  type: object
PromptFunctionAnnotationProjection:
  additionalProperties: false
  properties:
    end_residue_handle:
      $ref: '#/$defs/Identifier'
    label:
      maxLength: 256
      minLength: 1
      type: string
    start_residue_handle:
      $ref: '#/$defs/Identifier'
    state:
      enum:
      - source
      - current
      - changed
      - cleared
      - inserted
      - pending-delete
      type: string
  required:
  - label
  - start_residue_handle
  - end_residue_handle
  - state
  type: object
PromptMergeProjection:
  additionalProperties: false
  properties:
    adopt_annotations:
      items:
        $ref: '#/$defs/PromptFunctionAnnotationIntent'
      type: array
    confirmed:
      type: boolean
    correspondence:
      items:
        $ref: '#/$defs/PromptCorrespondenceRow'
      type: array
    remove_annotations:
      items:
        $ref: '#/$defs/PromptFunctionAnnotationIntent'
      type: array
    source:
      $ref: '#/$defs/PromptSourceFacts'
    track_adoptions:
      items:
        $ref: '#/$defs/PromptTrackAdoption'
      type: array
  required:
  - source
  - correspondence
  - confirmed
  - track_adoptions
  - adopt_annotations
  - remove_annotations
  type: object
PromptMergeSource:
  additionalProperties: false
  properties:
    function_annotations:
      items:
        $ref: '#/$defs/PromptFunctionAnnotationProjection'
      type: array
    residues:
      items:
        $ref: '#/$defs/PromptResidueProjection'
      type: array
    source:
      $ref: '#/$defs/PromptSourceFacts'
    source_index:
      minimum: 0
      type: integer
    tracks:
      $ref: '#/$defs/PromptTrackProjectionSet'
  required:
  - source_index
  - source
  - residues
  - tracks
  - function_annotations
  type: object
PromptMergeTarget:
  additionalProperties: false
  properties:
    function_annotations:
      items:
        $ref: '#/$defs/PromptFunctionAnnotationProjection'
      type: array
    merge_index:
      minimum: 0
      type: integer
    residues:
      items:
        $ref: '#/$defs/PromptResidueProjection'
      type: array
    tracks:
      $ref: '#/$defs/PromptTrackProjectionSet'
  required:
  - merge_index
  - residues
  - tracks
  - function_annotations
  type: object
PromptProjectedValue:
  oneOf:
  - type: 'null'
  - type: string
  - type: number
  - $ref: '#/$defs/PromptCoordinatesProjectionValue'
PromptRandomOperation:
  oneOf:
  - additionalProperties: false
    properties:
      count:
        maximum: 2000000
        minimum: 0
        type: integer
      eligible_residue_ids:
        items:
          minLength: 1
          type: string
        type: array
        uniqueItems: true
      kind:
        const: mask
      seed:
        maximum: 9007199254740991
        minimum: 0
        type: integer
      track:
        enum:
        - sequence
        - coordinates
        - secondary_structure
        - sasa
        type: string
    required:
    - kind
    - seed
    - count
    - track
    type: object
  - additionalProperties: false
    properties:
      count:
        maximum: 2000000
        minimum: 0
        type: integer
      eligible_chain_ids:
        items:
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
          type: string
        type: array
        uniqueItems: true
      kind:
        const: insert
      seed:
        maximum: 9007199254740991
        minimum: 0
        type: integer
      target_residues:
        items:
          additionalProperties: false
          properties:
            origin:
              enum:
              - source
              - inserted
              type: string
            residue_id:
              minLength: 1
              type: string
          required:
          - residue_id
          - origin
          type: object
        type: array
    required:
    - kind
    - seed
    - count
    type: object
PromptRandomSelection:
  additionalProperties: false
  properties:
    kind:
      enum:
      - insert
      - mask
    operation_index:
      minimum: 0
      type: integer
    realized_residue_handles:
      items:
        $ref: '#/$defs/Identifier'
      type: array
  required:
  - operation_index
  - kind
  - realized_residue_handles
  type: object
PromptResidueProjection:
  additionalProperties: false
  properties:
    chain_id:
      type: string
    position:
      minimum: 1
      type: integer
    residue_handle:
      $ref: '#/$defs/Identifier'
    residue_id:
      minLength: 1
      type: string
    residue_label:
      type: string
    state:
      enum:
      - current
      - inserted
      - pending-delete
      type: string
  required:
  - residue_handle
  - residue_id
  - chain_id
  - residue_label
  - position
  - state
  type: object
PromptRigidTransform:
  additionalProperties: false
  properties:
    origin:
      items:
        type: number
      maxItems: 3
      minItems: 3
      type: array
    residue_ids:
      items:
        minLength: 1
        type: string
      minItems: 1
      type: array
      uniqueItems: true
    rotation_matrix:
      items:
        items:
          type: number
        maxItems: 3
        minItems: 3
        type: array
      maxItems: 3
      minItems: 3
      type: array
    translation:
      items:
        type: number
      maxItems: 3
      minItems: 3
      type: array
  required:
  - rotation_matrix
  - origin
  - translation
  - residue_ids
  type: object
PromptSourceFacts:
  oneOf:
  - additionalProperties: false
    properties:
      chains:
        items:
          $ref: '#/$defs/PromptChainDeclaration'
        type: array
      kind:
        const: blank
      merge_sources:
        items:
          $ref: '#/$defs/PromptMergeSource'
        type: array
    required:
    - kind
    - chains
    type: object
  - additionalProperties: false
    properties:
      chain_ids:
        items:
          type: string
        type: array
      content_digest:
        $ref: '#/$defs/Digest'
      kind:
        enum:
        - fasta
        - pdb
      merge_sources:
        items:
          $ref: '#/$defs/PromptMergeSource'
        type: array
      project_input_ref:
        $ref: '#/$defs/ProjectInputReference'
    required:
    - kind
    - project_input_ref
    - content_digest
    - chain_ids
    type: object
  - additionalProperties: false
    properties:
      chain_ids:
        items:
          type: string
        type: array
      content_digest:
        $ref: '#/$defs/Digest'
      kind:
        const: protein_prompt
      merge_sources:
        items:
          $ref: '#/$defs/PromptMergeSource'
        type: array
      node_id:
        $ref: '#/$defs/NodeInstanceId'
      port:
        minLength: 1
        type: string
    required:
    - kind
    - content_digest
    - chain_ids
    type: object
PromptSourceMerge:
  additionalProperties: false
  properties:
    adopt_annotations:
      items:
        $ref: '#/$defs/PromptFunctionAnnotationIntent'
      type: array
    correspondence:
      items:
        $ref: '#/$defs/PromptCorrespondenceRow'
      type: array
    remove_annotations:
      items:
        $ref: '#/$defs/PromptFunctionAnnotationIntent'
      type: array
    source_index:
      minimum: 0
      type: integer
    track_adoptions:
      items:
        $ref: '#/$defs/PromptTrackAdoption'
      type: array
  required:
  - source_index
  - correspondence
  - track_adoptions
  - adopt_annotations
  - remove_annotations
  type: object
PromptSummary:
  additionalProperties: false
  properties:
    chains:
      items:
        $ref: '#/$defs/PromptChainDeclaration'
      type: array
    function_annotation_count:
      minimum: 0
      type: integer
    tracks:
      additionalProperties: false
      properties:
        coordinates:
          $ref: '#/$defs/PromptTrackSummary'
        sasa:
          $ref: '#/$defs/PromptTrackSummary'
        secondary_structure:
          $ref: '#/$defs/PromptTrackSummary'
        sequence:
          $ref: '#/$defs/PromptTrackSummary'
      required:
      - sequence
      - coordinates
      - secondary_structure
      - sasa
      type: object
  required:
  - chains
  - tracks
  - function_annotation_count
  type: object
PromptTargetResidue:
  additionalProperties: false
  properties:
    origin:
      enum:
      - source
      - inserted
      type: string
    residue_id:
      minLength: 1
      type: string
  required:
  - residue_id
  - origin
  type: object
PromptTrackAdoption:
  additionalProperties: false
  properties:
    mask_policy:
      enum:
      - adopt
      - preserve
      type: string
    source_residue_ids:
      items:
        minLength: 1
        type: string
      minItems: 1
      type: array
      uniqueItems: true
    track:
      enum:
      - sequence
      - coordinates
      - secondary_structure
      - sasa
      type: string
  required:
  - track
  - source_residue_ids
  - mask_policy
  type: object
PromptTrackEdit:
  oneOf:
  - additionalProperties: false
    properties:
      action:
        const: preserve
      residue_id:
        minLength: 1
        type: string
      track:
        enum:
        - sequence
        - coordinates
        - secondary_structure
        - sasa
        type: string
    required:
    - track
    - action
    - residue_id
    type: object
  - additionalProperties: false
    properties:
      action:
        const: clear
      residue_id:
        minLength: 1
        type: string
      track:
        enum:
        - sequence
        - coordinates
        - secondary_structure
        - sasa
        type: string
    required:
    - track
    - action
    - residue_id
    type: object
  - additionalProperties: false
    properties:
      action:
        const: replace
      residue_id:
        minLength: 1
        type: string
      track:
        enum:
        - sequence
        - coordinates
        - secondary_structure
        - sasa
        type: string
      value:
        $ref: '#/$defs/PromptTrackReplacementValue'
    required:
    - track
    - action
    - residue_id
    - value
    type: object
PromptTrackProjection:
  additionalProperties: false
  properties:
    residue_handle:
      $ref: '#/$defs/Identifier'
    state:
      enum:
      - source
      - current
      - changed
      - cleared
      - inserted
      - pending-delete
      type: string
    value:
      $ref: '#/$defs/PromptProjectedValue'
  required:
  - residue_handle
  - value
  - state
  type: object
PromptTrackProjectionCollection:
  additionalProperties: false
  properties:
    present:
      type: boolean
    values:
      items:
        $ref: '#/$defs/PromptTrackProjection'
      type: array
  required:
  - present
  - values
  type: object
PromptTrackProjectionSet:
  additionalProperties: false
  properties:
    coordinates:
      $ref: '#/$defs/PromptTrackProjectionCollection'
    sasa:
      $ref: '#/$defs/PromptTrackProjectionCollection'
    secondary_structure:
      $ref: '#/$defs/PromptTrackProjectionCollection'
    sequence:
      $ref: '#/$defs/PromptTrackProjectionCollection'
  required:
  - sequence
  - coordinates
  - secondary_structure
  - sasa
  type: object
PromptTrackReplacementValue:
  oneOf:
  - maxLength: 1
    minLength: 1
    pattern: ^[A-Z-]$
    type: string
  - minimum: 0
    type: number
  - additionalProperties: false
    properties:
      atom_coordinates:
        items:
          additionalProperties: false
          properties:
            atom_name:
              minLength: 1
              type: string
            coordinates:
              items:
                type: number
              maxItems: 3
              minItems: 3
              type: array
          required:
          - atom_name
          - coordinates
          type: object
        type: array
    required:
    - atom_coordinates
    type: object
PromptTrackSummary:
  additionalProperties: false
  properties:
    specified:
      minimum: 0
      type: integer
    unspecified:
      minimum: 0
      type: integer
  required:
  - specified
  - unspecified
  type: object
PromptVersionContext:
  additionalProperties: false
  properties:
    version_id:
      $ref: '#/$defs/Identifier'
  required:
  - version_id
  type: object
