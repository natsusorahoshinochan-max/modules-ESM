node_type_id: prompt_authoring.replace_protein_prompt_annotations
title: Replace ProteinPrompt annotations
summary: Replaces the complete final function annotation collection under one operation-scoped overlap policy.
category: prompt_authoring
inputs:
  - name: protein_prompt
    port_type_id: protein.prompt
    required: true
    multiplicity: one
    scientific_meaning: Identity-complete ProteinPrompt receiving the final annotations.
outputs:
  - name: protein_prompt
    port_type_id: protein.prompt
    required: true
    multiplicity: one
    scientific_meaning: ProteinPrompt with the complete canonical final function annotation collection.
parameter_groups:
  - id: annotations
    title: Final function annotations
    parameters: [annotations, overlap_policy]
node_parameters:
  annotations:
    parameter_scope: scientific
    scientific_meaning: Complete final annotation labels and exact inclusive endpoints.
    required: true
    value_contract:
      type: array
      maxItems: 2000000
      uniqueItems: true
      items:
        type: object
        additionalProperties: false
        required: [label, chain_id, start_residue_id, end_residue_id]
        properties:
          label:
            field_scope: scientific
            scientific_meaning: Function label preserved at the provider boundary.
            type: string
            minLength: 1
            maxLength: 256
          chain_id:
            field_scope: scientific
            scientific_meaning: Chain containing both inclusive endpoints.
            type: string
            pattern: "^[A-Za-z0-9]$"
          start_residue_id:
            field_scope: scientific
            scientific_meaning: Exact first annotated residue identity.
            type: string
            pattern: "^[A-Za-z0-9]:(?:[A-Za-z0-9][A-Za-z0-9_.-]{0,63}|[+-][0-9]{1,3}[A-Za-z]?)$"
          end_residue_id:
            field_scope: scientific
            scientific_meaning: Exact last annotated residue identity.
            type: string
            pattern: "^[A-Za-z0-9]:(?:[A-Za-z0-9][A-Za-z0-9_.-]{0,63}|[+-][0-9]{1,3}[A-Za-z]?)$"
  overlap_policy:
    parameter_scope: scientific
    scientific_meaning: Whether final inclusive intervals may share residues.
    required: true
    value_contract:
      type: string
      enum: [reject, allow]
