node_type_id: prompt_authoring.insert_masked_residues
title: Insert identity-addressed masked residues
summary: Inserts explicit residue identities at exact adjacent source boundaries while preserving every source identity and present track value.
category: prompt_authoring
inputs:
  - name: protein_prompt
    port_type_id: protein.prompt
    required: true
    multiplicity: one
    scientific_meaning: Identity-complete ProteinPrompt whose modeled residues and present track assignments will be preserved.
outputs:
  - name: protein_prompt
    port_type_id: protein.prompt
    required: true
    multiplicity: one
    scientific_meaning: Target Prompt with declared inserted identities explicitly masked on every present track.
  - name: residue_map
    port_type_id: residue.map
    required: true
    multiplicity: one
    scientific_meaning: Complete source-to-target map containing every source match and declared insertion, with no implicit deletion.
parameter_groups:
  - id: insertion_contract
    title: Deterministic insertions
    parameters:
      - insertions
node_parameters:
  insertions:
    parameter_scope: scientific
    scientific_meaning: Ordered non-overlapping source boundaries and exact target residue identities to insert at each boundary.
    required: true
    value_contract:
      type: array
      minItems: 1
      maxItems: 2000000
      items:
        type: object
        additionalProperties: false
        required:
          - after_residue_id
          - before_residue_id
          - inserted_residue_ids
        properties:
          after_residue_id:
            field_scope: scientific
            scientific_meaning: Existing source identity immediately before the insertion.
            type: string
            pattern: "^[A-Za-z0-9]:[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$"
          before_residue_id:
            field_scope: scientific
            scientific_meaning: Existing source identity immediately after the insertion.
            type: string
            pattern: "^[A-Za-z0-9]:[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$"
          inserted_residue_ids:
            field_scope: scientific
            scientific_meaning: Ordered unique identities introduced between the two adjacent source anchors.
            type: array
            minItems: 1
            maxItems: 2000000
            uniqueItems: true
            items:
              type: string
              pattern: "^[A-Za-z0-9]:[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$"
