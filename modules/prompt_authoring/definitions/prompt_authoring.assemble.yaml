node_type_id: prompt_authoring.assemble
title: Assemble ProteinPrompt
summary: Assembles one ProteinPrompt from residue-conditioning tracks and a function annotation carrier that must all share one exact ResidueLayout.
category: prompt_authoring
inputs:
  - name: sequence
    port_type_id: residue.condition.sequence
    required: true
    multiplicity: one
    scientific_meaning: Sequence track; always present, all-null allowed.
  - name: coordinates
    port_type_id: residue.condition.coordinates
    required: true
    multiplicity: one
    scientific_meaning: Coordinates track; always present, all-null allowed.
  - name: secondary_structure
    port_type_id: residue.condition.secondary_structure
    required: false
    multiplicity: one
    scientific_meaning: Optional secondary-structure track; absent input means whole-track absent.
  - name: sasa
    port_type_id: residue.condition.sasa
    required: false
    multiplicity: one
    scientific_meaning: Optional SASA track; absent input means whole-track absent.
  - name: function_annotations
    port_type_id: residue.condition.function_annotations
    required: true
    multiplicity: one
    scientific_meaning: Function annotation carrier; an empty track is legal.
outputs:
  - name: protein_prompt
    port_type_id: protein.prompt
    required: true
    multiplicity: one
    scientific_meaning: Validated ProteinPrompt assembled from the aligned inputs.
parameter_groups: []
node_parameters: {}
