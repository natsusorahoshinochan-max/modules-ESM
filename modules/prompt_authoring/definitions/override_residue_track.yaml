schema_version: "2.1.0"
node_type_id: prompt_authoring.override_residue_track
version: "2.1.0"
title: Override residue track
summary: Clears, preserves, or replaces identity-addressed values without shifting residue indices.
category: prompt_authoring
inputs:
  - name: target_layout
    port_type_id: residue.layout
    port_type_version: "2.1.0"
    required: true
    multiplicity: one
    scientific_meaning: Exact residue identities and chain boundaries required to equal the track's carried layout.
  - name: sequence_track
    port_type_id: prompt_authoring.track.sequence
    port_type_version: "2.1.0"
    required: false
    multiplicity: one
    scientific_meaning: Nullable amino-acid values aligned to target_layout.
  - name: structure_track
    port_type_id: prompt_authoring.track.structure
    port_type_version: "2.1.0"
    required: false
    multiplicity: one
    scientific_meaning: Nullable named-atom coordinates aligned to target_layout.
  - name: visibility_track
    port_type_id: prompt_authoring.track.visibility
    port_type_version: "2.1.0"
    required: false
    multiplicity: one
    scientific_meaning: Nullable boolean visibility values aligned to target_layout.
  - name: secondary_structure_track
    port_type_id: prompt_authoring.track.secondary_structure
    port_type_version: "2.1.0"
    required: false
    multiplicity: one
    scientific_meaning: Nullable SS8 values aligned to target_layout.
  - name: sasa_track
    port_type_id: prompt_authoring.track.sasa
    port_type_version: "2.1.0"
    required: false
    multiplicity: one
    scientific_meaning: Nullable non-negative solvent-accessibility values aligned to target_layout.
input_constraints:
  - kind: exactly_one
    ports:
      - sequence_track
      - structure_track
      - visibility_track
      - secondary_structure_track
      - sasa_track
outputs:
  - name: sequence_track
    port_type_id: prompt_authoring.track.sequence
    port_type_version: "2.1.0"
    required: false
    multiplicity: one
    scientific_meaning: Identity-aligned amino-acid values after explicit overrides.
  - name: structure_track
    port_type_id: prompt_authoring.track.structure
    port_type_version: "2.1.0"
    required: false
    multiplicity: one
    scientific_meaning: Identity-aligned named-atom coordinates after explicit overrides.
  - name: visibility_track
    port_type_id: prompt_authoring.track.visibility
    port_type_version: "2.1.0"
    required: false
    multiplicity: one
    scientific_meaning: Identity-aligned visibility values after explicit overrides.
  - name: secondary_structure_track
    port_type_id: prompt_authoring.track.secondary_structure
    port_type_version: "2.1.0"
    required: false
    multiplicity: one
    scientific_meaning: Identity-aligned SS8 values after explicit overrides.
  - name: sasa_track
    port_type_id: prompt_authoring.track.sasa
    port_type_version: "2.1.0"
    required: false
    multiplicity: one
    scientific_meaning: Identity-aligned solvent-accessibility values after explicit overrides.
parameter_groups:
  - id: overrides
    title: Residue overrides
    parameters:
      - overrides
node_parameters:
  overrides:
    parameter_scope: scientific
    scientific_meaning: Identity-addressed clear, preserve, or concrete replacement operations.
    required: true
    value_contract:
      type: array
      maxItems: 2000000
      uniqueItems: true
      items:
        oneOf:
          - type: object
            additionalProperties: false
            required:
              - action
              - residue_id
            properties:
              action:
                field_scope: scientific
                scientific_meaning: Explicitly make this residue value nullable.
                const: clear
              residue_id:
                field_scope: scientific
                scientific_meaning: Canonical chain-qualified residue identity to clear.
                type: string
                pattern: "^[A-Za-z0-9]:[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$"
          - type: object
            additionalProperties: false
            required:
              - action
              - residue_id
            properties:
              action:
                field_scope: scientific
                scientific_meaning: Explicitly retain this residue's current value.
                const: preserve
              residue_id:
                field_scope: scientific
                scientific_meaning: Canonical chain-qualified residue identity to preserve.
                type: string
                pattern: "^[A-Za-z0-9]:[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$"
          - type: object
            additionalProperties: false
            required:
              - action
              - residue_id
              - value
            properties:
              action:
                field_scope: scientific
                scientific_meaning: Explicitly replace this residue's current value.
                const: replace
              residue_id:
                field_scope: scientific
                scientific_meaning: Canonical chain-qualified residue identity to replace.
                type: string
                pattern: "^[A-Za-z0-9]:[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$"
              value:
                field_scope: scientific
                scientific_meaning: Concrete scalar or named-atom coordinate replacement interpreted by the selected nominal track.
                oneOf:
                  - type: boolean
                  - type: number
                  - type: string
                  - type: object
                    additionalProperties: false
                    required:
                      - atom_coordinates
                    properties:
                      atom_coordinates:
                        field_scope: scientific
                        scientific_meaning: Ordered named-atom coordinates for one residue.
                        type: array
                        minItems: 1
                        maxItems: 64
                        items:
                          type: object
                          additionalProperties: false
                          required:
                            - atom_name
                            - coordinates
                          properties:
                            atom_name:
                              field_scope: scientific
                              scientific_meaning: Canonical atom name.
                              type: string
                              pattern: "^[A-Z0-9][A-Z0-9']{0,3}$"
                            coordinates:
                              field_scope: scientific
                              scientific_meaning: Finite Cartesian position of the named atom.
                              type: array
                              minItems: 3
                              maxItems: 3
                              items:
                                type: number
