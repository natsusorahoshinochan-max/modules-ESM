node_type_id: prompt_authoring.add_function_annotation
title: Add function annotation
summary: Adds one chain-qualified inclusive residue interval with canonical ordering and explicit overlap policy.
category: prompt_authoring
inputs:
  - name: layout
    port_type_id: residue.layout
    required: true
    multiplicity: one
    scientific_meaning: Identity-complete effective residue layout used to resolve the interval.
  - name: existing_annotations
    port_type_id: function.annotations
    required: false
    multiplicity: one
    scientific_meaning: Existing canonical annotations aligned to the same effective layout.
outputs:
  - name: function_annotations
    port_type_id: function.annotations
    required: true
    multiplicity: one
    scientific_meaning: Canonically ordered annotations retaining chain-qualified endpoint provenance.
parameter_groups:
  - id: annotation
    title: Function annotation
    parameters:
      - annotation
      - overlap_policy
node_parameters:
  annotation:
    parameter_scope: scientific
    scientific_meaning: One label and pair of inclusive chain-qualified residue identities to add.
    required: true
    value_contract:
      type: object
      additionalProperties: false
      required:
        - label
        - chain_id
        - start_residue_id
        - end_residue_id
      properties:
        label:
          field_scope: scientific
          scientific_meaning: Non-empty function label preserved at the provider boundary.
          type: string
          minLength: 1
          maxLength: 256
        chain_id:
          field_scope: scientific
          scientific_meaning: Canonical chain owning both inclusive interval endpoints.
          type: string
          pattern: "^[A-Za-z0-9]$"
        start_residue_id:
          field_scope: scientific
          scientific_meaning: Canonical chain-qualified identity of the first annotated residue.
          type: string
          pattern: "^[A-Za-z0-9]:(?:[A-Za-z0-9][A-Za-z0-9_.-]{0,63}|[+-][0-9]{1,3}[A-Za-z]?)$"
        end_residue_id:
          field_scope: scientific
          scientific_meaning: Canonical chain-qualified identity of the last annotated residue.
          type: string
          pattern: "^[A-Za-z0-9]:(?:[A-Za-z0-9][A-Za-z0-9_.-]{0,63}|[+-][0-9]{1,3}[A-Za-z]?)$"
  overlap_policy:
    parameter_scope: scientific
    scientific_meaning: Whether inclusive intervals may share residues.
    required: true
    value_contract:
      type: string
      enum:
        - reject
        - allow
