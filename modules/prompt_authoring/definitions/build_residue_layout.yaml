schema_version: "2.1.0"
node_type_id: prompt_authoring.build_residue_layout
version: "2.1.0"
title: Build residue layout
summary: Constructs one identity-complete ordered residue layout with explicit chain boundaries.
category: prompt_authoring
inputs: []
outputs:
  - name: layout
    port_type_id: residue.layout
    port_type_version: "2.1.0"
    required: true
    multiplicity: one
    scientific_meaning: Canonical contiguous-chain target residue layout.
parameter_groups:
  - id: layout
    title: Residue layout
    parameters:
      - chains
node_parameters:
  chains:
    parameter_scope: scientific
    scientific_meaning: Ordered chain identifiers and positive residue counts defining every canonical residue identity.
    required: true
    value_contract:
      type: array
      minItems: 1
      maxItems: 64
      uniqueItems: true
      items:
        type: object
        additionalProperties: false
        required:
          - chain_id
          - length
        properties:
          chain_id:
            field_scope: scientific
            scientific_meaning: One canonical chain identifier.
            type: string
            pattern: "^[A-Za-z0-9]$"
          length:
            field_scope: scientific
            scientific_meaning: Positive number of residues in this chain.
            type: integer
            minimum: 1
            maximum: 2000000
