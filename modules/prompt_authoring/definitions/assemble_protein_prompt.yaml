node_type_id: prompt_authoring.assemble_protein_prompt
title: Assemble ProteinPrompt
summary: Combines one exact residue layout with independently aligned optional scientific tracks.
category: prompt_authoring
inputs:
  - name: layout
    port_type_id: residue.layout
    required: true
    multiplicity: one
    scientific_meaning: Identity-complete effective residue layout shared by every present track and annotation.
  - name: sequence_track
    port_type_id: prompt_authoring.track.sequence
    required: false
    multiplicity: one
    scientific_meaning: Nullable amino-acid assignments aligned to the effective layout.
  - name: structure_track
    port_type_id: prompt_authoring.track.structure
    required: false
    multiplicity: one
    scientific_meaning: Nullable named-atom coordinates aligned to the effective layout.
  - name: visibility_track
    port_type_id: prompt_authoring.track.visibility
    required: false
    multiplicity: one
    scientific_meaning: Nullable structure-visibility choices aligned to the effective layout.
  - name: secondary_structure_track
    port_type_id: prompt_authoring.track.secondary_structure
    required: false
    multiplicity: one
    scientific_meaning: Nullable SS8 assignments aligned to the effective layout.
  - name: sasa_track
    port_type_id: prompt_authoring.track.sasa
    required: false
    multiplicity: one
    scientific_meaning: Nullable absolute per-residue solvent-accessible surface areas in square angstroms, without normalization, aligned to the effective layout.
  - name: function_annotations
    port_type_id: function.annotations
    required: false
    multiplicity: one
    scientific_meaning: Canonically ordered chain-qualified inclusive function intervals for the effective layout.
outputs:
  - name: protein_prompt
    port_type_id: protein.prompt
    required: true
    multiplicity: one
    scientific_meaning: Validated residue-aligned multi-track ProteinPrompt whose SASA track, when present, contains absolute square-angstrom areas without normalization.
parameter_groups: []
node_parameters: {}
