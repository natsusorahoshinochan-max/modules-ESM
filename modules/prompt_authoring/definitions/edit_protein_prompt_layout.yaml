node_type_id: prompt_authoring.edit_protein_prompt_layout
title: Edit ProteinPrompt layout
summary: Applies complete identity-addressed insertions and deletions to every present Prompt track and annotation interval.
category: prompt_authoring
inputs:
  - name: protein_prompt
    port_type_id: protein.prompt
    required: true
    multiplicity: one
    scientific_meaning: Identity-complete ProteinPrompt before the layout edit.
outputs:
  - name: protein_prompt
    port_type_id: protein.prompt
    required: true
    multiplicity: one
    scientific_meaning: ProteinPrompt on the exact target layout with every present track and annotation interval synchronously remapped.
  - name: residue_map
    port_type_id: residue.map
    required: true
    multiplicity: one
    scientific_meaning: Complete exact source-to-target residue correspondence containing every match, insertion, and deletion.
  - name: layout
    port_type_id: residue.layout
    required: true
    multiplicity: one
    scientific_meaning: Exact target layout carried by the updated ProteinPrompt and complete residue map.
parameter_groups:
  - id: layout_edit
    title: Whole-Prompt layout edit
    parameters: [insertions, deleted_residue_ids]
node_parameters:
  insertions:
    parameter_scope: scientific
    scientific_meaning: Ordered exact inserted identities at explicit source residue boundaries.
    required: true
    value_contract:
      type: array
      maxItems: 2000000
      items:
        type: object
        additionalProperties: false
        required: [inserted_residue_ids]
        properties:
          after_residue_id:
            field_scope: scientific
            scientific_meaning: Exact existing source identity immediately before the insertion.
            type: string
            pattern: "^[A-Za-z0-9]:(?:[A-Za-z0-9][A-Za-z0-9_.-]{0,63}|[+-][0-9]{1,3}[A-Za-z]?)$"
          before_residue_id:
            field_scope: scientific
            scientific_meaning: Exact existing source identity immediately after the insertion.
            type: string
            pattern: "^[A-Za-z0-9]:(?:[A-Za-z0-9][A-Za-z0-9_.-]{0,63}|[+-][0-9]{1,3}[A-Za-z]?)$"
          inserted_residue_ids:
            field_scope: scientific
            scientific_meaning: Ordered exact identities introduced at this boundary.
            type: array
            minItems: 1
            maxItems: 2000000
            uniqueItems: true
            items:
              type: string
              pattern: "^[A-Za-z0-9]:(?:[A-Za-z0-9][A-Za-z0-9_.-]{0,63}|[+-][0-9]{1,3}[A-Za-z]?)$"
  deleted_residue_ids:
    parameter_scope: scientific
    scientific_meaning: Complete exact source residue identities removed from the target Prompt.
    required: true
    value_contract:
      type: array
      maxItems: 2000000
      uniqueItems: true
      items:
        type: string
        pattern: "^[A-Za-z0-9]:(?:[A-Za-z0-9][A-Za-z0-9_.-]{0,63}|[+-][0-9]{1,3}[A-Za-z]?)$"
