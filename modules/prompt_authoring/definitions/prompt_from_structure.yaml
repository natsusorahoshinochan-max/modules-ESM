schema_version: "2.1.0"
node_type_id: prompt_authoring.prompt_from_structure
version: "2.1.0"
title: Build a ProteinPrompt from a structure
summary: Converts one exact PDB structure into residue-identified sequence, coordinate, and visibility tracks without provider-specific values.
category: prompt_authoring
inputs:
  - name: structure
    port_type_id: protein.structure
    port_type_version: "2.1.0"
    required: true
    multiplicity: one
    scientific_meaning: Single-model PDB structure whose ordered canonical residues define the prompt.
outputs:
  - name: layout
    port_type_id: residue.layout
    port_type_version: "2.1.0"
    required: true
    multiplicity: one
    scientific_meaning: Exact ordered chain-qualified residue identities parsed from the PDB structure.
  - name: protein_prompt
    port_type_id: protein.prompt
    port_type_version: "2.1.0"
    required: true
    multiplicity: one
    scientific_meaning: ProteinPrompt carrying exact sequence, named-atom coordinate, and visibility tracks from the structure.
parameter_groups: []
node_parameters: {}
