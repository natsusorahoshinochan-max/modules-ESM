<script id="feedback-logic">
const Feedback = (() => {
  const copy = value => JSON.parse(JSON.stringify(value));
  function initial() { return {selected:null,mode:null,rows:[],preview:null,undo:null,delivery:null,log:[],message:'请选择一个真实结果。'}; }
  function indexes(text,length) {const result = new Set();for(const region of text.split(',')){const [start,end=start]=region.trim().split('-').map(Number);if(!Number.isInteger(start)||!Number.isInteger(end)||start<1||end<start||end>length)throw Error('区间超出当前目标位置');for(let i=start;i<=end;i++)result.add(i-1);}return result;}
  function reduce(current,action,data) {
    let state=copy(current); state.message='';
    if(action.type==='choose'||action.type==='sequence_only') {
      const item=data.objects.find(x=>x.object_id===action.object_id);if(!item)throw Error('请选择已有结果');
      state=initial();state.selected=item.object_id;state.mode=action.type==='choose'?'structure':'sequence';
      state.rows=[...item.sequence].map((amino_acid,i)=>({key:`position-${i+1}`,amino_acid,source_number:i+1,atoms:state.mode==='structure'?copy(item.positions[i].atoms):{},sequence_fixed:false,coordinates_selected:false}));
      state.message=`已明确采用 ${item.label} 的${state.mode==='structure'?'序列和结构':'序列'}。`;
    } else {
      if(!state.selected)throw Error('先选择结果');
      if(['fix','coords','preview','deliver'].includes(action.type)&&state.preview)throw Error('先确认或取消当前预览');
      if(action.type==='fix'){const selected=indexes(action.regions,state.rows.length);state.rows.forEach((r,i)=>{if(selected.has(i)&&r.amino_acid==='X')throw Error('未知位置不能固定为已有字符');r.sequence_fixed=selected.has(i);});state.message='已按当前目标位置设置序列条件。';}
      if(action.type==='coords'){if(state.mode!=='structure')throw Error('纯序列没有可选坐标');const selected=indexes(action.regions,state.rows.length);state.rows.forEach((r,i)=>{if(selected.has(i)&&!['N','CA','C'].every(a=>r.atoms[a]))throw Error('所选位置没有完整骨架坐标');r.coordinates_selected=selected.has(i);});state.message='已选择不连续骨架区域；其他已有坐标仍在文件中。';}
      if(action.type==='preview'){
        const rows=copy(state.rows),after=action.after,count=action.count,remove=action.delete_position;
        if(!Number.isInteger(after)||after<0||after>rows.length||!Number.isInteger(count)||count<1||count>20)throw Error('插入位置或数量无效');
        rows.splice(after,0,...Array.from({length:count},(_,i)=>({key:`new-${state.log.length}-${i}`,amino_acid:'X',source_number:null,atoms:{},sequence_fixed:false,coordinates_selected:false})));
        if(!Number.isInteger(remove)||remove<1||remove>rows.length)throw Error('删除位置超出增补后的目标');rows.splice(remove-1,1);
        state.preview=rows;state.message='预览已显示；确认前已采用模板保持原状。';
      }
      if(action.type==='confirm'){if(!state.preview)throw Error('没有待确认预览');state.undo=copy(state.rows);state.rows=state.preview;state.preview=null;state.message='已采用已预览的实际位置和条件。';}
      if(action.type==='cancel'){if(!state.preview)throw Error('没有待取消预览');state.preview=null;state.message='已取消，长度、字符与条件恢复为预览前状态。';}
      if(action.type==='undo'){if(!state.undo||state.preview)throw Error('当前没有可撤销的确认');state.rows=state.undo;state.undo=null;state.message='已撤销一次确认。';}
      if(action.type==='deliver'){state.delivery=delivery(state);state.message='已生成交付预览；浏览器中没有执行模型调用。';}
    }
    if(action.type!=='deliver')state.delivery=null;
    state.log.push(copy(action));return state;
  }
  function delivery(state){
    if(state.preview)throw Error('请先确认预览');
    const request={selected_object_id:state.selected,chain:'A',sequence_conditions:[],coordinate_conditions:[]};
    request[state.mode==='structure'?'structure_file':'sequence_file']=state.mode==='structure'?'target.cif':'target.json';
    const positions=state.rows.map((r,i)=>{if(r.sequence_fixed)request.sequence_conditions.push({target_index:i,amino_acid:r.amino_acid});if(r.coordinates_selected)request.coordinate_conditions.push({target_index:i,atoms:['N','CA','C']});return {target_position:i+1,author_number:r.source_number,amino_acid:r.amino_acid,atoms:copy(r.atoms)};});
    return {request,target:{chain:'A',positions},actions:copy(state.log)};
  }
  return {initial,reduce,delivery};
})();
</script>
<script>
let current=Feedback.initial();const scenarios=[{title:'结构回流并确认',description:'采用真实结构，指定两段坐标，插入两位、删除一位。留意后段条件随编辑移动。',actions:[['选择结构结果',{type:'choose'}],['固定前五个字符',{type:'fix',regions:'1-5'}],['选择两段坐标',{type:'coords',regions:'1-5,30-35'}],['预览 58 → 59 位',{type:'preview',after:11,count:2,delete_position:27}],['确认',{type:'confirm'}],['交付',{type:'deliver'}]]},{title:'预览后取消',description:'设置条件后预览增删，取消应完整保留原58位以及原来条件。',actions:[['选择结构结果',{type:'choose'}],['固定前五个字符',{type:'fix',regions:'1-5'}],['选择坐标',{type:'coords',regions:'1-5,30-35'}],['预览增删',{type:'preview',after:11,count:2,delete_position:27}],['取消',{type:'cancel'}],['交付原模板',{type:'deliver'}]]},{title:'纯序列建立模板',description:'仅采用同一候选的序列。增删与固定字符仍然可用，坐标条件保持为空。',actions:[['选择纯序列',{type:'sequence_only'}],['固定前五个字符',{type:'fix',regions:'1-5'}],['预览增删',{type:'preview',after:11,count:2,delete_position:27}],['确认',{type:'confirm'}],['交付',{type:'deliver'}]]}];let tab=0,step=0;
const byId=id=>document.getElementById(id);byId('candidate').innerHTML=FEEDBACK_DATA.objects.map(o=>`<option value="${o.object_id}">${o.label}</option>`).join('');
function dispatch(action){try{current=Feedback.reduce(current,{...action,object_id:action.object_id||byId('candidate').value},FEEDBACK_DATA);}catch(error){current.message=error.message;}render();}
function render(){const rows=current.preview||current.rows;byId('metrics').innerHTML=[['当前显示长度',rows.length],['已采用长度',current.rows.length],['固定字符',rows.filter(r=>r.sequence_fixed).length],['骨架条件位置',rows.filter(r=>r.coordinates_selected).length],['阶段',current.preview?'预览':'已采用']].map(([k,v])=>`<div class="metric"><small>${k}</small><strong>${v}</strong></div>`).join('');byId('change').textContent=current.message;byId('rows').innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.amino_acid==='X'?'待设计':r.amino_acid}</td><td>${r.sequence_fixed?r.amino_acid:'可设计'}</td><td>${r.coordinates_selected?'N / CA / C':'未选择'}</td><td>${Object.keys(r.atoms).join(' ')||'无'}</td><td>${r.source_number??'新增'}</td></tr>`).join('');byId('delivery').textContent=current.delivery?JSON.stringify({request:current.delivery.request,target_positions:current.delivery.target.positions.length,positions_without_atoms:current.delivery.target.positions.filter(p=>!Object.keys(p.atoms).length).map(p=>p.target_position)},null,2):'尚未交付';byId('state').textContent=JSON.stringify(current,null,2);byId('tabs').innerHTML=scenarios.map((s,i)=>`<button class="${i===tab?'active':''}" data-tab="${i}">${s.title}</button>`).join('');byId('scenario').textContent=scenarios[tab].description;byId('steps').innerHTML=scenarios[tab].actions.map(([label],i)=>`<button data-step="${i}" ${i!==step?'disabled':''}>${i+1}. ${label}</button>`).join('');byId('evidence').textContent=FEEDBACK_DATA.evidence_note;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab!==undefined){tab=Number(b.dataset.tab);step=0;current=Feedback.initial();render();return;}if(b.dataset.step!==undefined){dispatch(scenarios[tab].actions[step][1]);step++;render();return;}const type=b.dataset.action;if(!type)return;if(type==='download'){try{const blob=new Blob([JSON.stringify(Feedback.delivery(current),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='prototype-feedback-delivery.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),100);}catch(error){current.message=error.message;render();}return;}dispatch({type,regions:byId(type==='coords'?'coordrange':'seqrange').value,after:Number(byId('after').value),count:Number(byId('count').value),delete_position:Number(byId('delete').value)});});render();
</script></html>
