module_id: esm3.generate
version: 1.2.0
display_name: ESM3 Generate
category: model
description: "Paired ESM-3 generation: each sequence is generated first, then its structure track is sampled without template coordinates. Candidate pairs remain index-matched and confidence metrics reference the sequence Candidate."
input_ports:
  - name: protein_prompt
    type_id: protein.prompt
    display_name: ProteinPrompt
    description: "Multi-track protein prompt for ESM-3 conditioning."
output_ports:
  - name: sequence_candidates
    type_id: candidate.collection
    display_name: Sequence Candidates
    description: "Generated sequence candidates (item_type: protein.sequence)."
  - name: structure_candidates
    type_id: candidate.collection
    display_name: Structure Candidates
    description: "Sampled structure candidates paired by sample index and lineage to sequence Candidates (item_type: protein.structure)."
  - name: scores
    type_id: score.collection
    display_name: Scores
    description: "Validated pTM, pLDDT, and optional PAE metrics from sampled structures, referencing sequence Candidates."
parameters:
  - name: model_name
    type: enum
    default: "esm3-medium-2024-08"
    display_name: Model
    description: "ESM-3 model to use."
    options:
      - "esm3-medium-2024-08"
      - "esm3-open-2024-03"
      - "esm3_sm_open_v1"
  - name: num_steps
    type: int
    default: 20
    min: 1
    display_name: Num Steps
    description: "Number of generation steps."
  - name: temperature
    type: float
    default: 1.0
    min: 0.0
    display_name: Temperature
    description: "Sampling temperature."
  - name: top_p
    type: float
    default: 1.0
    min: 0.0
    max: 1.0
    display_name: Top P
    description: "Top-p sampling threshold."
  - name: num_samples
    type: int
    default: 1
    min: 1
    display_name: Num Samples
    description: "Number of index-paired sequence-then-structure samples to generate."
  - name: seed
    type: int
    default: null
    display_name: Seed
    description: "Optional deterministic Workbench client RNG seed; defaults to the run seed."
module_api: "1.0"
