module_id: prompt.override_residue_track
version: 1.2.0
display_name: Override Residue Track
category: prompt
description: "Override individual residue positions in a track with manual values."
input_ports:
  - name: track_input
    type_id: residue.track
    required: false
    display_name: Track
    description: "Input residue track to override."
  - name: secondary_structure_track_input
    type_id: residue.track.secondary_structure
    required: false
    display_name: Secondary Structure Track
    description: "Secondary-structure track to override without erasing its Port type."
input_groups:
  - name: track_input
    alternatives:
      - [track_input]
      - [secondary_structure_track_input]
output_ports:
  - name: track_output
    type_id: residue.track
    required: false
    display_name: Track
    description: "Updated residue track with overrides applied."
  - name: secondary_structure_track_output
    type_id: residue.track.secondary_structure
    required: false
    display_name: Secondary Structure Track
    description: "Updated secondary-structure track with its Port type preserved."
output_groups:
  - name: track_output
    alternatives:
      - [track_output]
      - [secondary_structure_track_output]
parameters:
  - name: overrides
    type: str
    default: "[]"
    display_name: Overrides
    description: "JSON list of overrides."
  - name: clear_unmentioned
    type: bool
    default: false
    display_name: Clear Unmentioned
    description: "Set positions not listed in overrides to the track sentinel, so overrides describe the complete final-layout intent."
module_api: "1.0"
