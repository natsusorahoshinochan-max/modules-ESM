module_id: selection.filter
version: 1.0.0
display_name: Filter Candidates
category: selection
description: "Filters candidates by score thresholds. Candidates whose scores don't satisfy ALL conditions are removed."
input_ports:
  - name: candidates
    type_id: candidate.collection
    display_name: Candidates
    description: "CandidateCollection to filter."
  - name: scores
    type_id: score.collection
    display_name: Scores
    description: "ScoreCollection with scores for each candidate."
output_ports:
  - name: candidates
    type_id: candidate.collection
    display_name: Filtered Candidates
    description: "Candidates that pass all filter conditions."
parameters:
  - name: conditions
    type: string
    default: "[]"
    display_name: Conditions
    description: "JSON list of conditions, each with score (score_id), operator (>=, <=, >, <, ==, !=), value (float)."
module_api: "1.0"
