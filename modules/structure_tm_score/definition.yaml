module_id: structure.tm_score
version: 1.0.1
display_name: TM-score
category: scoring
description: "Computes standard per-residue TM-score from a pre-computed StructureAlignment, normalized by the reference length."
input_ports:
  - name: alignment
    type_id: structure.alignment
    display_name: Alignment
    description: "Pre-computed StructureAlignment."
output_ports:
  - name: scores
    type_id: score.collection
    display_name: Scores
    description: "Reference-normalized TM-score entry with normalization length and reference coverage."
module_api: "1.0"
