module_id: structure.batch_tm_score
version: 2.0.0
display_name: Batch TM-score
category: scoring
description: "Compute standard reference-normalized TM-scores from shared sequence-aware StructureAlignments. Outputs one score entry per candidate with subjects referencing candidate IDs."
input_ports:
  - name: alignments
    type_id: candidate.collection
    display_name: Alignments
    description: "Collection of pre-computed StructureAlignment evidence items."
output_ports:
  - name: scores
    type_id: score.collection
    display_name: Scores
    description: "ScoreCollection with one reference-normalized TM-score entry per candidate."
parameters:
  - name: score_id
    type: string
    default: "tm_score"
    display_name: Score ID
    description: "Identifier for output score entries. Use to differentiate multiple batch_tm_score instances in the same DAG."
module_api: "1.0"
