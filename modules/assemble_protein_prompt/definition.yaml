module_id: prompt.assemble_protein_prompt
version: 1.1.0
display_name: Assemble ProteinPrompt
category: prompt
description: "Assembles all residue tracks and annotations into a complete ProteinPrompt object."
input_ports:
  - name: layout
    type_id: residue.layout
    display_name: Layout
    description: "Target residue layout."
  - name: sequence_track
    type_id: residue.track
    required: false
    display_name: Sequence Track
    description: "Per-residue amino acid assignments."
  - name: structure_track
    type_id: residue.track
    required: false
    display_name: Structure Track
    description: "Per-residue 3D coordinates."
  - name: visibility_track
    type_id: residue.track
    required: false
    display_name: Visibility Track
    description: "Per-residue structure visibility."
  - name: secondary_structure_track
    type_id: residue.track
    required: false
    display_name: Secondary Structure Track
    description: "Per-residue DSSP codes."
  - name: sasa_track
    type_id: residue.track.sasa
    required: false
    display_name: SASA Track
    description: "Per-residue SASA values."
  - name: function_annotations
    type_id: function.annotations
    required: false
    display_name: Function Annotations
    description: "Named residue range annotations."
output_ports:
  - name: protein_prompt
    type_id: protein.prompt
    display_name: ProteinPrompt
    description: "Complete multi-track protein prompt."
parameters: []
module_api: "1.0"
