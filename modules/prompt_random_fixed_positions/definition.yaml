module_id: prompt.random_fixed_positions
version: 1.0.0
display_name: Random Fixed Positions
category: prompt
description: "Randomly select a fraction of positions as fixed_positions for ProteinMPNN constraints. Given the same seed, the same positions are always selected."
input_ports: []
output_ports:
  - name: constraints
    type_id: proteinmpnn.constraints
    display_name: Constraints
    description: "ProteinMPNN constraints with randomly chosen fixed_positions."
parameters:
  - name: length
    type: int
    default: 1
    min: 1
    display_name: Length
    description: "Total number of residue positions to select from."
  - name: fraction
    type: float
    default: 0.5
    min: 0.0
    max: 1.0
    display_name: Fraction
    description: "Fraction of positions to randomly fix (0.0 to 1.0)."
module_api: "1.0"
