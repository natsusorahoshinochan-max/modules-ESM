module_id: prompt.compute_sasa
version: 1.0.0
display_name: Compute SASA
category: prompt
description: "Computes per-residue solvent accessible surface area from a ProteinStructure."
input_ports:
  - name: structure
    type_id: protein.structure
    display_name: Structure
    description: "Protein structure to analyse."
output_ports:
  - name: sasa_track
    type_id: residue.track.sasa
    display_name: SASA Track
    description: "Per-residue SASA values in square angstroms."
parameters:
  - name: dssp_binary
    type: str
    default: "/opt/homebrew/bin/mkdssp"
    display_name: DSSP Binary Path
    description: "Path to the mkdssp executable."
module_api: "1.0"
