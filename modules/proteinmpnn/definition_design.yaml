module_id: proteinmpnn.design
version: 1.1.0
display_name: ProteinMPNN Design
category: model
description: "Generates protein sequences from a structure using ProteinMPNN."
input_ports:
  - name: structure
    type_id: protein.structure
    required: false
    display_name: Structure
    description: "Single input protein structure (PDB)."
  - name: structures
    type_id: candidate.collection
    required: false
    display_name: Structure Candidates
    description: "Collection of protein.structure Candidates; num_sequences is applied per parent."
  - name: sequence
    type_id: protein.sequence
    required: false
    display_name: Reference Sequence
    description: "Optional reference sequence aligned exactly to the structure target layout."
  - name: constraints
    type_id: proteinmpnn.constraints
    required: false
    display_name: Constraints
    description: "Optional design constraints."
input_groups:
  - name: design_input
    alternatives:
      - [structure]
      - [structures]
output_ports:
  - name: candidates
    type_id: candidate.collection
    display_name: Candidates
    description: "Generated sequence candidates."
  - name: scores
    type_id: score.collection
    display_name: Scores
    description: "Per-sequence scores."
parameters:
  - name: model_name
    type: enum
    default: "v_48_020"
    display_name: Model
    description: "ProteinMPNN model variant."
    options:
      - "v_48_002"
      - "v_48_010"
      - "v_48_020"
      - "v_48_030"
  - name: num_sequences
    type: int
    default: 1
    min: 1
    display_name: Num Sequences
    description: "Number of sequences to generate."
  - name: temperature
    type: float
    default: 0.1
    min: 0.000001
    display_name: Temperature
    description: "Sampling temperature."
  - name: backbone_noise
    type: float
    default: 0.0
    min: 0.0
    display_name: Backbone Noise
    description: "Standard deviation in angstroms of Gaussian noise added to backbone atoms."
  - name: seed
    type: int
    default: null
    display_name: Seed
    description: "Optional Node seed override; when unset, the run seed is used."
module_api: "1.0"
