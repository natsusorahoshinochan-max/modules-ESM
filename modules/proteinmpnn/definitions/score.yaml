node_type_id: proteinmpnn.score
title: Score a sequence with ProteinMPNN
summary: Evaluate one existing sequence against one independently chosen backbone with ProteinMPNN; generation ancestry is unchanged.
category: protein_scoring
inputs:
  - name: sequence_candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Exactly one complete sequence Candidate using the 20 standard amino acids or the official ProteinMPNN unknown token X. Without residue identities, sequence positions follow the complete supplied backbone axis; explicit residue identities must match that axis unless a complete sequence_correspondence is supplied.
  - name: structure_residue_axes
    port_type_id: structure_transform.candidate_resolved_residue_axis_associations
    required: true
    multiplicity: one
    scientific_meaning: Exactly one reference-associated complete backbone residue axis, selected independently of sequence generation ancestry.
outputs:
  - name: scores
    port_type_id: score.collection
    required: true
    multiplicity: one
    scientific_meaning: One pairwise ProteinMPNN masked-mean score identifying both sequence subject and backbone reference.
parameter_groups:
  - id: evaluation
    title: ProteinMPNN evaluation
    parameters:
      - effective_seed
      - backbone_noise
      - sequence_correspondence
node_parameters:
  effective_seed:
    parameter_scope: scientific
    scientific_meaning: Explicit Torch seed for the scoring decoding order and backbone noise; zero is an exact seed rather than a request for a random seed.
    value_contract:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    default: 42
  backbone_noise:
    parameter_scope: scientific
    scientific_meaning: Standard deviation in angstroms of Gaussian noise applied to backbone atom coordinates by ProteinMPNN.
    value_contract:
      type: number
      minimum: 0
    default: 0
  sequence_correspondence:
    parameter_scope: scientific
    scientific_meaning: Optional complete one-to-one correspondence from original sequence positions to chosen backbone residues. It affects this evaluation only and does not change Candidate identity or generation ancestry. Empty uses existing matching identities or the order of an unlabelled sequence.
    value_contract:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [sequence_position, residue_id]
        properties:
          sequence_position:
            field_scope: scientific
            scientific_meaning: One-based position in the original sequence.
            type: integer
            minimum: 1
          residue_id:
            field_scope: scientific
            scientific_meaning: Selected reference-backbone residue corresponding to this sequence position.
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*:(?:[A-Za-z0-9][A-Za-z0-9_.-]{0,63}|[+-][0-9]+[A-Za-z]?)$"
    default: []
