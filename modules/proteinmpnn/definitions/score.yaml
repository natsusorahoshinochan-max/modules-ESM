schema_version: "2.1.0"
node_type_id: proteinmpnn.score
version: "7.0.0"
title: Score a sequence with ProteinMPNN
summary: Observes the exact ProteinMPNN native sequence score for one identified sequence Candidate against its one identified parent structure Candidate.
category: protein_scoring
inputs:
  - name: structure_candidates
    port_type_id: candidate.collection
    port_type_version: "4.0.0"
    required: true
    multiplicity: one
    scientific_meaning: Exactly one complete parent structure Candidate used by the fixed scoring Method.
  - name: sequence_candidates
    port_type_id: candidate.collection
    port_type_version: "4.0.0"
    required: true
    multiplicity: one
    scientific_meaning: Exactly one complete sequence Candidate whose sole parent is the supplied structure Candidate.
  - name: structure_residue_axes
    port_type_id: structure_transform.candidate_resolved_residue_axis_associations
    port_type_version: "6.0.0"
    required: true
    multiplicity: one
    scientific_meaning: The exact-reference-associated resolved residue axis for the supplied structure Candidate.
outputs:
  - name: scores
    port_type_id: score.collection
    port_type_version: "5.0.0"
    required: true
    multiplicity: one
    scientific_meaning: One typed intrinsic ProteinMPNN score Observation for the exact sequence Candidate.
parameter_groups: []
node_parameters: {}
