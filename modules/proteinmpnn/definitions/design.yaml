node_type_id: proteinmpnn.design
title: Design sequences with ProteinMPNN
summary: Designs an exact complete number of child sequences for each selected structure parent through one fixed ProteinMPNN Method.
category: protein_design
inputs:
  - name: structure_residue_axes
    port_type_id: structure_transform.candidate_resolved_residue_axis_associations
    required: true
    multiplicity: one
    scientific_meaning: Nonempty exact-reference-associated resolved residue axes whose entry order is the sole owner of every parent slot, of each parent's derived effective call seed, and of the output parent order.
  - name: sequence
    port_type_id: protein.sequence
    required: false
    multiplicity: one
    scientific_meaning: Optional complete canonical sequence in backbone order; explicit residue identities must match each selected target axis.
  - name: constraints
    port_type_id: proteinmpnn.constraints
    required: false
    multiplicity: one
    scientific_meaning: Optional complete identity-addressed ProteinMPNN constraints validated against every selected structure target layout.
outputs:
  - name: sequence_candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Complete designed sequence children ordered by parent then zero-based sample slot with exact parent lineage.
parameter_groups:
  - id: sampling
    title: ProteinMPNN sampling
    parameters:
      - effective_seed
      - num_sequences
      - temperature
      - backbone_noise
node_parameters:
  effective_seed:
    parameter_scope: scientific
    scientific_meaning: Fully resolved Workbench seed from which one stable provider seed is derived per exact parent Candidate.
    required: true
    value_contract:
      type: integer
      minimum: 0
      maximum: 9007199254740991
  num_sequences:
    parameter_scope: scientific
    scientific_meaning: Exact complete number of sequence children requested independently for every selected parent.
    value_contract:
      type: integer
      minimum: 1
    default: 1
  temperature:
    parameter_scope: scientific
    scientific_meaning: Positive finite ProteinMPNN sampling temperature fixed for every selected parent.
    value_contract:
      type: number
      exclusiveMinimum: 0
    default: 0.1
  backbone_noise:
    parameter_scope: scientific
    scientific_meaning: Finite non-negative angstrom standard deviation of ProteinMPNN backbone coordinate noise.
    value_contract:
      type: number
      minimum: 0
    default: 0
