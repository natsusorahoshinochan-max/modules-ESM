node_type_id: proteinmpnn.constraints
title: Author ProteinMPNN constraints
summary: Authors one complete ProteinMPNN constraint value against an explicit identity-complete residue layout.
category: protein_design
inputs:
  - name: layout
    port_type_id: residue.layout
    required: true
    multiplicity: one
    scientific_meaning: Exact ordered residue and chain layout against which every position and chain constraint is validated.
outputs:
  - name: constraints
    port_type_id: proteinmpnn.constraints
    required: true
    multiplicity: one
    scientific_meaning: Complete validated identity-addressed ProteinMPNN constraint value on the supplied layout.
parameter_groups:
  - id: residue_constraints
    title: Residue constraints
    parameters:
      - designable_residue_ids
      - fixed_residue_ids
      - tied_residue_groups
      - bias_by_residue
  - id: chain_constraints
    title: Chain constraints
    parameters:
      - designed_chains
      - fixed_chains
  - id: amino_acid_constraints
    title: Amino-acid constraints
    parameters:
      - omit_amino_acids
node_parameters:
  designable_residue_ids:
    parameter_scope: scientific
    scientific_meaning: Unique stable residue identities that remain designable within the effective designed-chain partition.
    value_contract:
      type: array
      uniqueItems: true
      items:
        type: string
        pattern: &residue_identity_pattern "^[A-Za-z0-9]:(?:[A-Za-z0-9][A-Za-z0-9_.-]{0,63}|[+-][0-9]{1,3}[A-Za-z]?)$"
    default: []
  fixed_residue_ids:
    parameter_scope: scientific
    scientific_meaning: Unique stable residue identities fixed to the supplied structure or optional reference sequence.
    value_contract:
      type: array
      uniqueItems: true
      items:
        type: string
        pattern: *residue_identity_pattern
    default: []
  designed_chains:
    parameter_scope: scientific
    scientific_meaning: Unique chain identifiers to design; omitted chains become fixed.
    value_contract:
      type: array
      uniqueItems: true
      items:
        type: string
        pattern: "^[A-Za-z0-9]$"
    default: []
  fixed_chains:
    parameter_scope: scientific
    scientific_meaning: Unique chain identifiers to preserve; omitted chains become designed when designed_chains is empty.
    value_contract:
      type: array
      uniqueItems: true
      items:
        type: string
        pattern: "^[A-Za-z0-9]$"
    default: []
  omit_amino_acids:
    parameter_scope: scientific
    scientific_meaning: Unique canonical ProteinMPNN amino-acid symbols excluded globally from sampling.
    value_contract:
      type: array
      uniqueItems: true
      items:
        type: string
        enum: [A, C, D, E, F, G, H, I, K, L, M, N, P, Q, R, S, T, V, W, Y]
    default: []
  tied_residue_groups:
    parameter_scope: scientific
    scientific_meaning: Disjoint groups of two or more stable designable residue identities constrained to share one sampled amino acid.
    value_contract:
      type: array
      items:
        type: array
        minItems: 2
        uniqueItems: true
        items:
          type: string
          pattern: *residue_identity_pattern
    default: []
  bias_by_residue:
    parameter_scope: scientific
    scientific_meaning: Ordered per-residue amino-acid logit biases on stable designable residue identities.
    value_contract:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [residue_id, amino_acid, bias]
        properties:
          residue_id:
            field_scope: scientific
            scientific_meaning: Stable target-layout residue identity receiving this bias.
            type: string
            pattern: *residue_identity_pattern
          amino_acid:
            field_scope: scientific
            scientific_meaning: Canonical ProteinMPNN amino-acid symbol receiving this bias.
            type: string
            enum: [A, C, D, E, F, G, H, I, K, L, M, N, P, Q, R, S, T, V, W, Y]
          bias:
            field_scope: scientific
            scientific_meaning: Finite additive ProteinMPNN sampling-logit bias.
            type: number
    default: []
