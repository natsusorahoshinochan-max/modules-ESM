node_type_id: proteinmpnn.constraints
title: Author ProteinMPNN constraints
summary: Authors one complete ProteinMPNN constraint value against an explicit identity-complete residue layout.
category: protein_design
inputs:
  - name: structure_residue_axis
    port_type_id: structure_transform.resolved_residue_axis
    required: true
    multiplicity: one
    scientific_meaning: The authoritative resolved structure residue axis whose layout every position and chain constraint addresses.
outputs:
  - name: constraints
    port_type_id: proteinmpnn.constraints
    required: true
    multiplicity: one
    scientific_meaning: Complete validated identity-addressed ProteinMPNN constraint value on the supplied layout.
parameter_groups:
  - id: residue_constraints
    title: Residue constraints
    parameters:
      - designable_residue_ids
      - fixed_residue_ids
      - tied_residue_groups
      - tied_weights
      - bias_by_residue
  - id: chain_constraints
    title: Chain constraints
    parameters:
      - designed_chains
      - fixed_chains
  - id: amino_acid_constraints
    title: Amino-acid constraints
    parameters:
      - omit_amino_acids
      - amino_acid_bias
      - omit_by_residue
  - id: pssm
    title: Position-specific scoring matrix
    parameters: [pssm_by_residue, pssm_multi, pssm_bias_flag, pssm_log_odds_flag, pssm_threshold]
node_parameters:
  designable_residue_ids:
    parameter_scope: scientific
    scientific_meaning: Unique stable residue identities that remain designable within the effective designed-chain partition.
    value_contract:
      type: array
      uniqueItems: true
      items:
        type: string
        pattern: &residue_identity_pattern "^[A-Za-z0-9][A-Za-z0-9_.-]*:(?:[A-Za-z0-9][A-Za-z0-9_.-]{0,63}|[+-][0-9]+[A-Za-z]?)$"
    default: []
  fixed_residue_ids:
    parameter_scope: scientific
    scientific_meaning: Unique stable residue identities fixed to the supplied structure or optional reference sequence.
    value_contract:
      type: array
      uniqueItems: true
      items:
        type: string
        pattern: *residue_identity_pattern
    default: []
  designed_chains:
    parameter_scope: scientific
    scientific_meaning: Unique chain identifiers to design; omitted chains become fixed.
    value_contract:
      type: array
      uniqueItems: true
      items:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
    default: []
  fixed_chains:
    parameter_scope: scientific
    scientific_meaning: Unique chain identifiers to preserve; omitted chains become designed when designed_chains is empty.
    value_contract:
      type: array
      uniqueItems: true
      items:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
    default: []
  omit_amino_acids:
    parameter_scope: scientific
    scientific_meaning: Unique canonical ProteinMPNN amino-acid symbols excluded globally from sampling.
    value_contract:
      type: array
      uniqueItems: true
      items:
        type: string
        enum: [A, C, D, E, F, G, H, I, K, L, M, N, P, Q, R, S, T, V, W, Y]
    default: []
  tied_residue_groups:
    parameter_scope: scientific
    scientific_meaning: Disjoint groups sharing one sampled amino acid. Every member must have identical position omissions, biases and PSSM rows because the official tied sampler reads these controls from the last member.
    value_contract:
      type: array
      items:
        type: array
        minItems: 2
        uniqueItems: true
        items:
          type: string
          pattern: *residue_identity_pattern
    default: []
  bias_by_residue:
    parameter_scope: scientific
    scientific_meaning: Ordered per-residue amino-acid logit biases on stable designable residue identities.
    value_contract:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [residue_id, amino_acid, bias]
        properties:
          residue_id:
            field_scope: scientific
            scientific_meaning: Stable target-layout residue identity receiving this bias.
            type: string
            pattern: *residue_identity_pattern
          amino_acid:
            field_scope: scientific
            scientific_meaning: Canonical ProteinMPNN amino-acid symbol receiving this bias.
            type: string
            enum: [A, C, D, E, F, G, H, I, K, L, M, N, P, Q, R, S, T, V, W, Y]
          bias:
            field_scope: scientific
            scientific_meaning: Finite additive ProteinMPNN sampling-logit bias.
            type: number
    default: []
  omit_by_residue:
    parameter_scope: scientific
    scientific_meaning: Per-position amino acids excluded after PSSM processing, addressed on the supplied residue axis.
    value_contract:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [residue_id, amino_acids]
        properties:
          residue_id:
            field_scope: scientific
            scientific_meaning: Selected backbone residue.
            type: string
            pattern: *residue_identity_pattern
          amino_acids:
            field_scope: scientific
            scientific_meaning: Standard amino acids excluded at this position.
            type: array
            uniqueItems: true
            minItems: 1
            items:
              type: string
              enum: [A, C, D, E, F, G, H, I, K, L, M, N, P, Q, R, S, T, V, W, Y]
    default: []
  pssm_by_residue:
    parameter_scope: scientific
    scientific_meaning: Selected residue PSSM rows; arrays follow ACDEFGHIKLMNPQRSTVWY. Unspecified residues use the provider's neutral row.
    value_contract:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [residue_id, coefficient, probabilities, log_odds]
        properties:
          residue_id:
            field_scope: scientific
            scientific_meaning: Selected backbone residue.
            type: string
            pattern: *residue_identity_pattern
          coefficient:
            field_scope: scientific
            scientific_meaning: Per-position multiplier of pssm_multi in the probability mixture.
            type: number
            minimum: 0
            maximum: 1
          probabilities:
            field_scope: scientific
            scientific_meaning: Normalized probabilities in ACDEFGHIKLMNPQRSTVWY order.
            type: array
            minItems: 20
            maxItems: 20
            items:
              type: number
              minimum: 0
              maximum: 1
          log_odds:
            field_scope: scientific
            scientific_meaning: Log-odds values in ACDEFGHIKLMNPQRSTVWY order, compared strictly greater than pssm_threshold.
            type: array
            minItems: 20
            maxItems: 20
            items:
              type: number
    default: []
  pssm_multi:
    parameter_scope: scientific
    scientific_meaning: Global PSSM probability mixing weight multiplied by each position coefficient.
    value_contract:
      type: number
      minimum: 0
      maximum: 1
    default: 0
  pssm_bias_flag:
    parameter_scope: scientific
    scientific_meaning: Enable mixing the PSSM probabilities with model probabilities.
    value_contract:
      type: boolean
    default: false
  pssm_log_odds_flag:
    parameter_scope: scientific
    scientific_meaning: Enable the official soft log-odds mask, retaining its 0.001 probability floor before normalization.
    value_contract:
      type: boolean
    default: false
  pssm_threshold:
    parameter_scope: scientific
    scientific_meaning: Strict lower threshold used by the official PSSM log-odds mask.
    value_contract:
      type: number
    default: 0
  amino_acid_bias:
    parameter_scope: scientific
    scientific_meaning: Global additive amino-acid logit bias, divided by temperature by the official sampler.
    value_contract:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [amino_acid, bias]
        properties:
          amino_acid:
            field_scope: scientific
            scientific_meaning: Standard amino acid receiving the bias.
            type: string
            enum: [A, C, D, E, F, G, H, I, K, L, M, N, P, Q, R, S, T, V, W, Y]
          bias:
            field_scope: scientific
            scientific_meaning: Additive logit bias.
            type: number
    default: []
  tied_weights:
    parameter_scope: scientific
    scientific_meaning: Member logit weights for tied groups; omitted members use one. The official sampler sums weighted logits and divides by group size, not by the sum of weights.
    value_contract:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [residue_id, weight]
        properties:
          residue_id:
            field_scope: scientific
            scientific_meaning: Selected member of a tied group.
            type: string
            pattern: *residue_identity_pattern
          weight:
            field_scope: scientific
            scientific_meaning: Finite multiplier of this member's logits, without normalization by the sum of weights.
            type: number
    default: []
