metric_id: proteinmpnn.native_sequence_nll
title: ProteinMPNN native sequence negative log-likelihood
description: ProteinMPNN provider-native masked mean negative log-likelihood for one exact sequence Candidate against the independently selected backbone.
value_shape: scalar
unit: nats_per_designed_residue
direction: lower_is_better
canonical_range:
  minimum: 0
  maximum: 3.4028234663852886e+38
granularity: candidate
aggregation_semantics:
  kind: provider_masked_mean
  source_metric: proteinmpnn.native_residue_nll
  included_values: mask * chain_M * chain_M_pos
observation_context_schema:
  type: object
  properties:
    kind:
      const: pairwise
    subject_role:
      const: subject
    reference_role:
      const: reference
    pairing_mode:
      const: fixed_reference
    normalization:
      const: provider_masked_mean
  required:
    - kind
    - subject_role
    - reference_role
    - pairing_mode
    - normalization
  additionalProperties: false
validation_contract:
  finite: true
  numeric_format: binary32
  exact_round_trip: true
