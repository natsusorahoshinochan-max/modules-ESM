metric_id: proteinmpnn.native_residue_nll
title: ProteinMPNN native residue negative log-likelihood
description: ProteinMPNN provider-native negative log-likelihood on each position of the exact resolved-structure residue axis before the scoring mask is reduced.
value_shape: per_residue
unit: nats
direction: lower_is_better
canonical_range:
  minimum: 0
  maximum: 3.4028234663852886e+38
granularity: residue
aggregation_semantics:
  kind: none
observation_context_schema:
  type: object
  properties:
    kind:
      const: pairwise
    subject_role:
      const: subject
    reference_role:
      const: reference
    pairing_mode:
      const: fixed_reference
    normalization:
      const: none
  required:
    - kind
    - subject_role
    - reference_role
    - pairing_mode
    - normalization
  additionalProperties: false
validation_contract:
  finite: true
  numeric_format: binary32
  exact_round_trip: true
  masking:
    allow_null: true
