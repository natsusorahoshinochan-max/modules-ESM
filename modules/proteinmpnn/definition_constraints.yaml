module_id: proteinmpnn.constraints
version: 1.1.0
display_name: ProteinMPNN Constraints
category: prompt
description: "Defines residue-level constraints for ProteinMPNN design."
input_ports: []
output_ports:
  - name: constraints
    type_id: proteinmpnn.constraints
    display_name: Constraints
    description: "ProteinMPNN design constraints."
parameters:
  - name: designable_positions
    type: str
    default: "[]"
    display_name: Designable Positions
    description: "JSON list of zero-based target-layout residue indices to design."
  - name: fixed_positions
    type: str
    default: "[]"
    display_name: Fixed Positions
    description: "JSON list of zero-based target-layout residue indices to fix."
  - name: designed_chains
    type: str
    default: "[]"
    display_name: Designed Chains
    description: "JSON list of structure chain IDs to design."
  - name: fixed_chains
    type: str
    default: "[]"
    display_name: Fixed Chains
    description: "JSON list of structure chain IDs to keep fixed."
  - name: omit_amino_acids
    type: str
    default: "[]"
    display_name: Omit Amino Acids
    description: "JSON list of AA codes to exclude."
  - name: tied_positions
    type: str
    default: "[]"
    display_name: Tied Positions
    description: "JSON groups of zero-based target-layout positions that must share the same AA."
  - name: bias_by_res
    type: str
    default: "{}"
    display_name: Residue Bias
    description: "JSON map from zero-based target-layout positions to amino-acid bias maps."
module_api: "1.0"
