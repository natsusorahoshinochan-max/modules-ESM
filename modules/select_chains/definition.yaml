module_id: convert.select_chains
version: 1.0.0
display_name: Select Chains
category: conversion
description: "Produces a new ProteinStructure containing only the specified chains."
input_ports:
  - name: structure
    type_id: protein.structure
    display_name: Structure
    description: "Protein structure to filter chains from."
output_ports:
  - name: structure
    type_id: protein.structure
    display_name: Filtered Structure
    description: "ProteinStructure with only the selected chains."
parameters:
  - name: chains
    type: string
    default: "[]"
    display_name: Chains
    description: "JSON list of chain ID strings to keep."
module_api: "1.0"
