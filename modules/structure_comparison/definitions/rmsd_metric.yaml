metric_id: structure_comparison.rmsd
title: Root mean square deviation
description: Root mean square CA residual distance carried by one exact v4 subject-to-reference alignment evidence value.
value_shape: scalar
unit: angstrom
direction: lower_is_better
canonical_range:
  minimum: 0
  maximum: 3.4028234663852886e+38
granularity: candidate
aggregation_semantics:
  kind: none
observation_context_schema:
  type: object
  properties:
    kind:
      const: pairwise
    subject_role:
      const: subject
    reference_role:
      const: reference
    pairing_mode:
      enum: [fixed_reference, per_subject_counterpart]
    normalization:
      const: aligned-CA-mean-square-distance
    evidence_content_digest:
      type: string
    evidence_method:
      type: object
    subject_axis_content_digest:
      type: string
    reference_axis_content_digest:
      type: string
    normalization_length:
      type: integer
    aligned_atom_count:
      type: integer
  required:
    - kind
    - subject_role
    - reference_role
    - pairing_mode
    - normalization
  additionalProperties: false
validation_contract:
  finite: true
  minimum: 0
  structure_alignment_evidence:
    source_direction: input
    source_port: alignments
    normalization_length_source: aligned_atom_count
    required_context_fields:
      - evidence_content_digest
      - evidence_method
      - subject_axis_content_digest
      - reference_axis_content_digest
      - normalization_length
      - aligned_atom_count
