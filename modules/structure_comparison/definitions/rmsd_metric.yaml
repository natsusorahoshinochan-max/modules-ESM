schema_version: "2.1.0"
metric_id: structure_comparison.rmsd
version: "2.1.0"
title: Root mean square deviation
description: Root mean square CA residual distance after one exact subject-to-reference rigid alignment correspondence.
value_shape: scalar
unit: angstrom
direction: lower_is_better
canonical_range:
  minimum: 0
  maximum: 3.4028234663852886e+38
granularity: candidate
aggregation_semantics:
  kind: none
observation_context_schema:
  type: object
  properties:
    kind:
      const: pairwise
    subject_role:
      const: subject
    reference_role:
      const: reference
    pairing_mode:
      enum: [fixed_reference, per_subject_counterpart]
    normalization:
      const: ca-correspondence-mean-square-angstrom
  required:
    - kind
    - subject_role
    - reference_role
    - pairing_mode
    - normalization
  additionalProperties: false
validation_contract:
  finite: true
  minimum: 0
