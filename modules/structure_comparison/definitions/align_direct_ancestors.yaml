node_type_id: structure_comparison.align_direct_ancestors
title: Align Candidates to their direct design ancestors
summary: Aligns every subject to its explicit ProteinMPNN input ancestor while allowing several subjects to share one exact reference structure.
category: structure_comparison
inputs:
  - name: subjects
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Nonempty subject structure Candidates whose ancestors are established only by the explicit pairing.
  - name: subject_residue_axes
    port_type_id: structure_transform.candidate_resolved_residue_axis_associations
    required: true
    multiplicity: one
    scientific_meaning: Complete exact-reference-associated subject axes.
  - name: references
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Exact direct ProteinMPNN input ancestor structure Candidates; one reference may serve several subjects.
  - name: reference_residue_axes
    port_type_id: structure_transform.candidate_resolved_residue_axis_associations
    required: true
    multiplicity: one
    scientific_meaning: Complete exact-reference-associated ancestor axes.
  - name: pairing
    port_type_id: candidate.direct_ancestor_pairing
    required: true
    multiplicity: one
    scientific_meaning: Complete mapping with exactly one exact protein.structure ancestor reference per subject and shared references allowed.
outputs:
  - name: alignments
    port_type_id: structure_comparison.alignment_evidence
    required: true
    multiplicity: many
    scientific_meaning: One complete v4 alignment evidence value per exact subject and direct ancestor pair.
parameter_groups: []
node_parameters:
  pin_matching_chain_ids:
    parameter_scope: scientific
    scientific_meaning: When true, uniquely and identically named segments are pinned before sequence-based assignment; duplicate names fail. The default ignores chain identifiers.
    value_contract:
      type: boolean
    default: false
