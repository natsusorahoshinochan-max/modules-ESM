node_type_id: structure_comparison.tm_score_fixed_reference
title: Project fixed-reference normalized TM-score
summary: Computes fixed-reference TM-score solely from immutable v4 alignment residuals and the exact reference axis length; no alignment or optimization is rerun.
category: structure_comparison
inputs:
  - name: alignments
    port_type_id: structure_comparison.alignment_evidence
    required: true
    multiplicity: many
    scientific_meaning: Nonempty fixed-reference alignment evidence whose residuals and reference axis counts determine every score.
  - name: subjects
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Exact subject Candidate scope used only to close Observation provenance; score values are not computed from Candidate data.
  - name: references
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Exact single fixed-reference Candidate scope used only to close Observation provenance; score values are not computed from Candidate data.
outputs:
  - name: scores
    port_type_id: score.collection
    required: true
    multiplicity: one
    scientific_meaning: Evidence-provenanced reference-axis-normalized TM-score Observations, one per subject.
parameter_groups: []
node_parameters: {}
