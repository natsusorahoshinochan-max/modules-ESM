node_type_id: structure_comparison.align_pairs
title: Align related structure Candidates
summary: Aligns every subject-reference entry from one explicit Candidate relation using exact Candidate-associated residue axes.
category: structure_comparison
inputs:
  - {name: subject_residue_axes, port_type_id: structure_transform.candidate_resolved_residue_axis_associations, required: true, multiplicity: one, scientific_meaning: Nonempty exact-reference-associated subject axes whose subject set is the complete subject scope of the relation.}
  - {name: reference_residue_axes, port_type_id: structure_transform.candidate_resolved_residue_axis_associations, required: true, multiplicity: one, scientific_meaning: Nonempty exact-reference-associated reference axes whose subject set is the complete reference scope of the relation.}
  - {name: relation, port_type_id: candidate.relation, required: true, multiplicity: one, scientific_meaning: Ordered exact subject-to-reference relation; references may be shared, the relation must cover both axis scopes exactly, and its order is the order of the emitted alignment evidence.}
outputs:
  - {name: alignments, port_type_id: structure_comparison.alignment_evidence, required: true, multiplicity: many, scientific_meaning: One alignment evidence value per relation entry, in relation order.}
parameter_groups: []
node_parameters:
  pin_matching_chain_ids:
    parameter_scope: scientific
    scientific_meaning: When true, uniquely and identically named segments are pinned before sequence-based assignment; duplicate names fail.
    value_contract: {type: boolean}
    default: false
  subject_region:
    parameter_scope: scientific
    scientific_meaning: Exact chain, author residue number and insertion locations; empty selects the full axis. Selected positions retain original axis order without changing the structure.
    default: []
    value_contract:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [chain_id, residue_number, insertion_code]
        properties:
          chain_id: {type: string, minLength: 1, field_scope: scientific, scientific_meaning: Original chain identifier.}
          residue_number: {type: string, minLength: 1, field_scope: scientific, scientific_meaning: Original author residue number.}
          insertion_code: {type: string, field_scope: scientific, scientific_meaning: Original insertion code or empty.}
  reference_region:
    parameter_scope: scientific
    scientific_meaning: Exact chain, author residue number and insertion locations; empty selects the full axis. Selected positions retain original axis order without changing the structure.
    default: []
    value_contract:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [chain_id, residue_number, insertion_code]
        properties:
          chain_id: {type: string, minLength: 1, field_scope: scientific, scientific_meaning: Original chain identifier.}
          residue_number: {type: string, minLength: 1, field_scope: scientific, scientific_meaning: Original author residue number.}
          insertion_code: {type: string, field_scope: scientific, scientific_meaning: Original insertion code or empty.}
