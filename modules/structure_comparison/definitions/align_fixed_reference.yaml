node_type_id: structure_comparison.align_fixed_reference
title: Align structures to one fixed reference
summary: Aligns every subject to exactly one fixed reference through exact Candidate-associated resolved residue axes.
category: structure_comparison
inputs:
  - name: subjects
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Nonempty subject structure Candidates; collection position has no correspondence meaning.
  - name: subject_residue_axes
    port_type_id: structure_transform.candidate_resolved_residue_axis_associations
    required: true
    multiplicity: one
    scientific_meaning: Complete exact-reference-associated subject axes.
  - name: references
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Exactly one reference structure Candidate applied to every subject.
  - name: reference_residue_axes
    port_type_id: structure_transform.candidate_resolved_residue_axis_associations
    required: true
    multiplicity: one
    scientific_meaning: Complete exact-reference-associated reference axis bundle containing the fixed reference.
outputs:
  - name: alignments
    port_type_id: structure_comparison.alignment_evidence
    required: true
    multiplicity: many
    scientific_meaning: One complete v4 alignment evidence value per subject-to-fixed-reference pair.
parameter_groups: []
node_parameters:
  pin_matching_chain_ids:
    parameter_scope: scientific
    scientific_meaning: When true, uniquely and identically named segments are pinned before sequence-based assignment; duplicate names fail. The default ignores chain identifiers.
    value_contract:
      type: boolean
    default: false
