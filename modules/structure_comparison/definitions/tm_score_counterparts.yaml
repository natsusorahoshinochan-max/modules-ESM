node_type_id: structure_comparison.tm_score_counterparts
title: Project counterpart normalized TM-score
summary: Computes paired-counterpart TM-score solely from immutable v4 alignment residuals and each exact reference axis length; no alignment or optimization is rerun.
category: structure_comparison
inputs:
  - name: alignments
    port_type_id: structure_comparison.alignment_evidence
    required: true
    multiplicity: many
    scientific_meaning: Nonempty counterpart alignment evidence whose residuals and reference axis counts determine every score.
  - name: subjects
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Exact subject Candidate scope used only to close Observation provenance; score values are not computed from Candidate data.
  - name: references
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Exact reference Candidate scope used only to close Observation provenance; score values are not computed from Candidate data.
  - name: pairing
    port_type_id: candidate.pairing
    required: true
    multiplicity: one
    scientific_meaning: Complete one-to-one mapping of exact protein.structure Candidate Data References that closes counterpart Observation provenance.
outputs:
  - name: scores
    port_type_id: score.collection
    required: true
    multiplicity: one
    scientific_meaning: Evidence-provenanced reference-axis-normalized TM-score Observations, one per subject counterpart.
parameter_groups: []
node_parameters: {}
