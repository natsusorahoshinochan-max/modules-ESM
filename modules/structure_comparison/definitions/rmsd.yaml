schema_version: "2.0.0"
node_type_id: structure_comparison.rmsd
version: "2.0.0"
title: Observe alignment RMSD
summary: Emits declared pairwise RMSD Observations from exact immutable alignment evidence and the exact Candidate sources it names.
category: structure_comparison
inputs:
  - name: alignment
    port_type_id: structure_comparison.alignment
    port_type_version: "2.0.0"
    required: false
    multiplicity: one
    scientific_meaning: One immutable exact alignment for the fixed-reference Binding.
  - name: alignments
    port_type_id: structure_comparison.alignment_collection
    port_type_version: "2.0.0"
    required: false
    multiplicity: one
    scientific_meaning: Complete immutable one-to-one alignment evidence for the per-subject-counterpart Binding.
  - name: subjects
    port_type_id: candidate.collection
    port_type_version: "2.0.0"
    required: true
    multiplicity: one
    scientific_meaning: Exact subject Candidate source named by every emitted Observation.
  - name: references
    port_type_id: candidate.collection
    port_type_version: "2.0.0"
    required: true
    multiplicity: one
    scientific_meaning: Exact reference Candidate source named by every emitted Observation.
  - name: pairing
    port_type_id: candidate.pairing
    port_type_version: "2.0.0"
    required: false
    multiplicity: one
    scientific_meaning: Exact per-subject counterpart source required by the paired Binding.
input_constraints:
  - kind: exactly_one
    ports:
      - alignment
      - alignments
outputs:
  - name: scores
    port_type_id: score.collection
    port_type_version: "2.0.0"
    required: true
    multiplicity: one
    scientific_meaning: Declared pairwise RMSD Observations bound to exact subject, reference, Method, Metric, Context, and alignment normalization.
parameter_groups: []
node_parameters: {}
