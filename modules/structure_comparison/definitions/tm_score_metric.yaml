metric_id: structure_comparison.tm_score
title: Template modelling score
description: TM-score projected from exact v4 alignment residuals and normalized by the full reference resolved-axis residue count.
value_shape: scalar
unit: dimensionless
direction: higher_is_better
canonical_range:
  minimum: 0
  maximum: 1
granularity: candidate
aggregation_semantics:
  kind: none
observation_context_schema:
  type: object
  properties:
    kind:
      const: pairwise
    subject_role:
      const: subject
    reference_role:
      const: reference
    pairing_mode:
      enum: [fixed_reference, per_subject_counterpart]
    normalization:
      const: reference-axis-residue-count
    evidence_content_digest:
      type: string
    evidence_method:
      type: object
    subject_axis_content_digest:
      type: string
    reference_axis_content_digest:
      type: string
    normalization_length:
      type: integer
    aligned_atom_count:
      type: integer
  required:
    - kind
    - subject_role
    - reference_role
    - pairing_mode
    - normalization
  additionalProperties: false
validation_contract:
  finite: true
  minimum: 0
  maximum: 1
  structure_alignment_evidence:
    source_direction: input
    source_port: alignments
    normalization_length_source: reference_axis_residue_count
    required_context_fields:
      - evidence_content_digest
      - evidence_method
      - subject_axis_content_digest
      - reference_axis_content_digest
      - normalization_length
      - aligned_atom_count
