schema_version: "2.1.0"
node_type_id: structure_comparison.align_pairwise
version: "2.2.0"
title: Align explicitly paired structure collections
summary: Superimposes complete one-to-one subject and reference Candidate collections using only a typed exact Candidate pairing source.
category: structure_comparison
inputs:
  - name: subjects
    port_type_id: candidate.collection
    port_type_version: "2.1.0"
    required: true
    multiplicity: one
    scientific_meaning: Non-empty identified subject structure Candidates; collection order does not establish counterparts.
  - name: references
    port_type_id: candidate.collection
    port_type_version: "2.1.0"
    required: true
    multiplicity: one
    scientific_meaning: Non-empty identified reference structure Candidates; collection order does not establish counterparts.
  - name: pairing
    port_type_id: candidate.pairing
    port_type_version: "2.1.0"
    required: false
    multiplicity: one
    scientific_meaning: Complete one-to-one exact Candidate identity and content-digest mapping required by the direct counterpart Binding and omitted by the fixed-reference Binding.
outputs:
  - name: alignments
    port_type_id: structure_comparison.alignment
    port_type_version: "2.1.0"
    required: true
    multiplicity: many
    scientific_meaning: Complete one-to-one role-labelled alignment evidence in explicit pairing-source order.
parameter_groups: []
node_parameters: {}
