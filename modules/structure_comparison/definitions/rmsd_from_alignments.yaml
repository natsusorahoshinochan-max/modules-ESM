node_type_id: structure_comparison.rmsd_from_alignments
title: Project alignment-evidence RMSD
summary: Emits RMSD Observations from immutable alignment evidence and its explicit Candidate relation.
category: structure_comparison
inputs:
  - {name: alignments, port_type_id: structure_comparison.alignment_evidence, required: true, multiplicity: many, scientific_meaning: Nonempty ordered alignment evidence.}
  - {name: subjects, port_type_id: candidate.collection, required: true, multiplicity: one, scientific_meaning: Exact subject Candidate scope closing Observation provenance.}
  - {name: references, port_type_id: candidate.collection, required: true, multiplicity: one, scientific_meaning: Exact reference Candidate scope closing Observation provenance.}
  - {name: relation, port_type_id: candidate.relation, required: true, multiplicity: one, scientific_meaning: Ordered exact subject-to-reference relation represented by the evidence.}
outputs:
  - {name: scores, port_type_id: score.collection, required: true, multiplicity: one, scientific_meaning: One evidence-provenanced RMSD Observation per relation entry.}
parameter_groups: []
node_parameters: {}
