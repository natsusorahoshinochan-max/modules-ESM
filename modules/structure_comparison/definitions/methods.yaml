- method_id: structure_comparison.rmsd.from_alignment_evidence.method
  version: 4.0.0
  algorithm_identity:
    name: alignment-evidence-rmsd-projection
    source: StructureAlignmentEvidence.rmsd
    validation_formula: sqrt(fsum(residual_distance^2)/aligned_atom_count)
    recomputes_alignment: false
  model_identity:
    kind: none
  checkpoint_identity:
    kind: none
  featurization_identity:
    input: structure_comparison.alignment_evidence@5.0.0
    atom_selection: evidence-correspondence-CA
  source_identity:
    kind: repository-owned
  scale_contract:
    unit: angstrom
    normalization: aligned-CA-mean-square-distance
- method_id: structure_comparison.tm_score.reference_axis_normalized.method
  version: 4.0.0
  algorithm_identity:
    name: alignment-evidence-reference-axis-normalized-tm-score
    source: StructureAlignmentEvidence.residual_distance
    formula: sum(1/(1+(residual_distance/d0)^2))/reference_axis_residue_count
    d0: 0.5 when reference_axis_residue_count<=15; otherwise max(0.5,1.24*(reference_axis_residue_count-15)^(1/3)-1.8)
    recomputes_alignment: false
    optimization_engine: null
  model_identity:
    kind: none
  checkpoint_identity:
    kind: none
  featurization_identity:
    input: structure_comparison.alignment_evidence@5.0.0
    atom_selection: evidence-correspondence-CA
  source_identity:
    kind: repository-owned
  scale_contract:
    unit: dimensionless
    canonical_range:
    - 0
    - 1
    normalization: exact-reference-axis-residue-count
- method_id: structure_comparison.three_way_consistency.threshold_graph
