node_type_id: structure_comparison.region_statistics
title: Summarize existing residue observations
summary: Arithmetic mean of selected existing numeric residue observations, retaining subject, region and original measurement provenance; does not predict or create a new Metric.
category: structure_comparison
inputs:
  - {name: scores, port_type_id: score.collection, required: true, multiplicity: one, scientific_meaning: Existing numeric per-residue observations with exact subject and residue axis.}
outputs:
  - {name: statistics, port_type_id: structure_comparison.region_statistics, required: true, multiplicity: one, scientific_meaning: Per-observation regional means in original Metric units with selected and nonnull counts and exact original provenance.}
parameter_groups: []
node_parameters:
  metric_id:
    parameter_scope: scientific
    scientific_meaning: Original Metric to summarize. Each matching observation is kept separate by its exact subject and original context.
    required: true
    value_contract: {type: string, minLength: 1}
  missing_values:
    parameter_scope: scientific
    scientific_meaning: exclude_null averages only observed selected values; require_all rejects any missing selected value. Both reject an entirely missing region.
    default: exclude_null
    value_contract: {type: string, enum: [exclude_null, require_all]}
  region:
    parameter_scope: scientific
    scientific_meaning: Exact chain, author residue number and insertion locations; empty selects the full axis. Selected positions retain original axis order without changing the structure.
    default: []
    value_contract:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [chain_id, residue_number, insertion_code]
        properties:
          chain_id: {type: string, minLength: 1, field_scope: scientific, scientific_meaning: Original chain identifier.}
          residue_number: {type: string, minLength: 1, field_scope: scientific, scientific_meaning: Original author residue number.}
          insertion_code: {type: string, field_scope: scientific, scientific_meaning: Original insertion code or empty.}
