node_type_id: structure_comparison.rmsd_fixed_reference
title: Project fixed-reference alignment-evidence RMSD
summary: Emits fixed-reference RMSD Observations solely from immutable v4 alignment evidence without structures, axes, or new superposition.
category: structure_comparison
inputs:
  - name: alignments
    port_type_id: structure_comparison.alignment_evidence
    required: true
    multiplicity: many
    scientific_meaning: Nonempty fixed-reference alignment evidence whose exact residuals and provenance determine every Observation.
  - name: subjects
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Exact subject Candidate scope used only to close Observation provenance; RMSD values are not computed from Candidate data.
  - name: references
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Exact single fixed-reference Candidate scope used only to close Observation provenance; RMSD values are not computed from Candidate data.
outputs:
  - name: scores
    port_type_id: score.collection
    required: true
    multiplicity: one
    scientific_meaning: Evidence-provenanced fixed-reference RMSD Observations, one per subject.
parameter_groups: []
node_parameters: {}
