schema_version: "2.1.0"
node_type_id: structure_comparison.batch_tm_score
version: "2.2.0"
title: Observe a scoped batch of reference-normalized TM-scores
summary: Emits exactly one declared TM-score Observation per subject from complete fixed-reference or explicit per-subject alignment evidence.
category: structure_comparison
inputs:
  - name: alignments
    port_type_id: structure_comparison.alignment
    port_type_version: "2.1.0"
    required: true
    multiplicity: many
    scientific_meaning: Complete role-labelled alignment evidence for the selected fixed-reference or per-subject-counterpart Binding.
  - name: subjects
    port_type_id: candidate.collection
    port_type_version: "2.1.0"
    required: true
    multiplicity: one
    scientific_meaning: Exact subject structure Candidate source; collection order does not determine counterpart identity.
  - name: references
    port_type_id: candidate.collection
    port_type_version: "2.1.0"
    required: true
    multiplicity: one
    scientific_meaning: Exact reference structure Candidate source; names and lineage do not determine counterpart identity.
  - name: pairing
    port_type_id: candidate.pairing
    port_type_version: "2.1.0"
    required: false
    multiplicity: one
    scientific_meaning: Complete one-to-one exact Candidate pairing required only by the per-subject-counterpart Binding.
outputs:
  - name: scores
    port_type_id: score.collection
    port_type_version: "2.1.0"
    required: true
    multiplicity: one
    scientific_meaning: One declared source partition containing exactly one standard TM-score Observation per subject.
parameter_groups: []
node_parameters: {}
