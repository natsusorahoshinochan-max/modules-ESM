node_type_id: structure_transform.select_chains
title: Select structure chains
summary: Selects an ordered, nonempty set of chains while preserving their MODRES and SEQRES polymer declarations.
category: structure_transform
inputs:
  - name: structure
    port_type_id: protein.structure
    required: true
    multiplicity: one
    scientific_meaning: Full-atom single-model structure whose chains will be selected.
outputs:
  - name: structure
    port_type_id: protein.structure
    required: true
    multiplicity: one
    scientific_meaning: Canonical structure containing exactly the requested coordinate chains and their polymer declarations in requested order.
parameter_groups:
  - id: chain_selection
    title: Chain selection
    parameters:
      - chain_ids
node_parameters:
  chain_ids:
    parameter_scope: scientific
    scientific_meaning: Ordered unique PDB chain identifiers to retain.
    value_contract:
      type: array
      minItems: 1
      maxItems: 64
      uniqueItems: true
      items:
        type: string
        pattern: "^[A-Za-z0-9]$"
    required: true
