node_type_id: structure_transform.extract_sequence_candidates
title: Extract structure Candidate sequences
summary: Projects one sequence Candidate from every exact-reference-associated resolved structure residue axis.
category: structure_transform
inputs:
  - name: structure_candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Complete ordered structure Candidates used only for exact parent lineage and output ordering, never to reparse residue semantics.
  - name: residue_axes
    port_type_id: structure_transform.candidate_resolved_residue_axis_associations
    required: true
    multiplicity: one
    scientific_meaning: Complete exact-reference-associated parent residue populations whose Candidate identities become the sole output lineage.
outputs:
  - name: sequence_candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Ordered sequence Candidates in one-to-one correspondence with the input structure Candidates and carrying exact parent lineage.
parameter_groups: []
node_parameters: {}
