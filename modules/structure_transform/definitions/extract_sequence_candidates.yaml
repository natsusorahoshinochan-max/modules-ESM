node_type_id: structure_transform.extract_sequence_candidates
title: Extract structure Candidate sequences
summary: Projects one sequence Candidate from every exact-reference-associated resolved structure residue axis, in that value's entry order.
category: structure_transform
inputs:
  - name: residue_axes
    port_type_id: structure_transform.candidate_resolved_residue_axis_associations
    required: true
    multiplicity: one
    scientific_meaning: Nonempty exact-reference-associated parent residue populations whose entry order is the sole owner of the output order and whose subject Candidate IDs are the sole output lineage.
outputs:
  - name: sequence_candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Ordered sequence Candidates in one-to-one correspondence with the input residue-axis entries, each carrying its entry subject Candidate as exact parent.
parameter_groups: []
node_parameters: {}
