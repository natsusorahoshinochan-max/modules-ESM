inputs:
  - name: structure_candidates
    port_type_id: candidate.collection
    port_type_version: "3.0.0"
    required: true
    multiplicity: one
    scientific_meaning: Exact singleton structure Candidate population.
  - name: residue_axes
    port_type_id: structure_transform.candidate_resolved_residue_axis_associations
    port_type_version: "5.0.0"
    required: true
    multiplicity: one
    scientific_meaning: Exact singleton residue-axis association for the same structure Candidate.
outputs:
  - name: residue_axis
    port_type_id: structure_transform.resolved_residue_axis
    port_type_version: "4.0.0"
