node_type_id: structure_transform.select_candidate_chains
title: Select structure Candidate chains
summary: Selects ordered chains and their MODRES and SEQRES declarations from every structure Candidate while preserving exact parent lineage.
category: structure_transform
inputs:
  - name: structure_candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Ordered complete structure Candidates whose identities become the sole parents of selected-chain Candidates.
outputs:
  - name: structure_candidates
    port_type_id: candidate.collection
    required: true
    multiplicity: one
    scientific_meaning: Ordered selected-chain structure Candidates in one-to-one correspondence with the input Candidates.
parameter_groups:
  - id: selection
    title: Chain selection
    parameters:
      - chain_ids
node_parameters:
  chain_ids:
    parameter_scope: scientific
    scientific_meaning: Ordered exact chain identifiers retained in every output structure Candidate.
    required: true
    value_contract:
      type: array
      minItems: 1
      maxItems: 62
      uniqueItems: true
      items:
        type: string
        pattern: "^[A-Za-z0-9]$"
