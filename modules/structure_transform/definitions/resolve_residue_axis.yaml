node_type_id: structure_transform.resolve_residue_axis
title: Resolve structure residue axis
summary: Classifies every observed component and emits one identity-complete protein residue axis with explicit topology, coordinates, masks, and modified-residue provenance.
category: structure_transform
inputs:
  - name: structure
    port_type_id: protein.structure
    required: true
    multiplicity: one
    scientific_meaning: Exact single-model PDB structure preserved inside the resolved value.
  - name: modified_residue_normalizations
    port_type_id: structure_transform.modified_residue_normalizations
    required: false
    multiplicity: one
    scientific_meaning: Exact upstream component-to-parent correspondence already applied to this structure.
outputs:
  - name: residue_axis
    port_type_id: structure_transform.resolved_residue_axis
    required: true
    multiplicity: one
    scientific_meaning: The sole admitted protein axis, component dispositions, segment topology, selected atom coordinates, masks, and normalization records for this structure.
parameter_groups: []
node_parameters: {}
