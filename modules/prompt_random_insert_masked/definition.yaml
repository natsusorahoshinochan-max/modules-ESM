module_id: prompt.random_insert_masked
version: 1.0.0
display_name: Random Insert Masked
category: prompt
description: "Randomly insert N sentinel (masked) values at positions in a residue track, updating the residue layout accordingly. Given the same seed, the same insertion positions are always selected."
input_ports:
  - name: track
    type_id: residue.track
    display_name: Track
    description: "Input residue track to insert masked positions into."
  - name: layout
    type_id: residue.layout
    display_name: Layout
    description: "Current residue layout that will be extended by count positions."
output_ports:
  - name: track
    type_id: residue.track
    display_name: Track
    description: "Output residue track with count sentinel values inserted."
  - name: layout
    type_id: residue.layout
    display_name: Layout
    description: "Updated residue layout with length increased by count."
parameters:
  - name: count
    type: int
    default: 0
    display_name: Insert Count
    description: "Number of sentinel values to randomly insert into the track."
    min: 0
module_api: "1.0"
