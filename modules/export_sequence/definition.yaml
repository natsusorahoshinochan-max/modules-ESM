module_id: export.sequence
version: 2.0.0
display_name: Export Sequence
category: output
description: "Writes a ProteinSequence to a FASTA file."
input_ports:
  - name: sequence
    type_id: protein.sequence
    display_name: Sequence
    description: "The protein sequence to export."
output_ports:
  - name: file_path
    type_id: file.path
    artifact_kind: standalone
    display_name: Output Path
    description: "Path to the exported FASTA file."
parameters:
  - name: filename
    type: str
    default: "exported.fasta"
    display_name: Filename
    description: "Output filename (written under the configured run output namespace)."
module_api: "1.0"
